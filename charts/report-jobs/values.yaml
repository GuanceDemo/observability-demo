image:
  repository: pubrepo.jiagouyun.com/demo/observability-demo-report-jobs
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
suspend: true
mysql:
  host: demo-observability-demo-mysql
  port: 3306
  user: mall_reports_writer
secret:
  name: mall-report-jobs
openlineage:
  url: https://openway.guance.com
  jobNamespace: mall-demo.data-pipeline
  datasetNamespace: mysql://demo-observability-demo-mysql:3306
jobs:
  daily:
    schedule: "1-56/5 * * * *"
    heapMb: 256
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {cpu: "1", memory: 384Mi}
  trend:
    schedule: "2-57/5 * * * *"
    heapMb: 896
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {cpu: "2", memory: 1536Mi}
