{{- if not (has .Values.ddtrace.mode (list "initContainer" "operator" "disabled" "legacy")) -}}
{{- fail "ddtrace.mode must be initContainer, operator, disabled or legacy" -}}
{{- end -}}
{{- if or (has .Values.ddtrace.version (list "latest" "main")) (not (regexMatch "^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$" .Values.ddtrace.version)) -}}
{{- fail "ddtrace.version must be an explicit image tag" -}}
{{- end -}}
{{- if regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+$" .Values.image.tag -}}
{{- if and (semverCompare "<2.4.0" .Values.image.tag) (ne .Values.ddtrace.mode "legacy") -}}
{{- fail "pre-2.4 business images contain an Agent; use ddtrace.mode=legacy to avoid double injection" -}}
{{- end -}}
{{- if and (semverCompare ">=2.4.0" .Values.image.tag) (eq .Values.ddtrace.mode "legacy") -}}
{{- fail "business images >=2.4 require external injection or explicit disabled mode" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.rum.mobile.enabled (empty .Values.rum.mobile.androidApplicationId) (empty .Values.rum.mobile.iosApplicationId) -}}
{{- fail "at least one of rum.mobile.androidApplicationId or rum.mobile.iosApplicationId is required when rum.mobile.enabled=true" -}}
{{- end -}}
{{- if and .Values.rum.enabled (not (empty .Values.rum.applicationId)) (eq .Values.rum.applicationId .Values.rum.gameApplicationId) -}}
{{- fail "rum.gameApplicationId must differ from rum.applicationId when rum.enabled=true" -}}
{{- end -}}
{{- $services := list
  (dict "name" "gateway-service" "port" 8080)
  (dict "name" "order-service" "port" 8080)
  (dict "name" "inventory-service" "port" 8081)
  (dict "name" "payment-service" "port" 8082)
-}}
{{- $ddTags := printf "project:%s,pod_name:$(POD_NAME),pod_namespace:$(POD_NAMESPACE),host:$(NODE_NAME),container_name:$(CONTAINER_NAME)" .Values.observability.project -}}
{{- if .Values.observability.clusterName -}}
{{- $ddTags = printf "%s,cluster_name_k8s:%s" $ddTags .Values.observability.clusterName -}}
{{- end -}}
{{- if and .Values.game.enabled (ne .Values.ddtrace.mode "legacy") -}}
{{- $services = append $services (dict "name" "game-service" "port" 8084) -}}
{{- end -}}
{{- range $index, $service := $services }}
{{- if $index }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability-demo.fullname" $ }}-{{ $service.name }}
  labels:
    {{- include "observability-demo.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "observability-demo.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $service.name }}
  template:
    metadata:
      labels:
        {{- include "observability-demo.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $service.name }}
        {{- if eq $.Values.ddtrace.mode "operator" }}
        admission.datakit/ddtrace-language: java
        {{- end }}
        project: {{ required "observability.project is required" $.Values.observability.project | quote }}
      annotations:
        admission.datakit/ddtrace.enabled: {{ eq $.Values.ddtrace.mode "operator" | quote }}
        {{- if eq $.Values.ddtrace.mode "operator" }}
        admission.datakit/java-lib.version: {{ $.Values.ddtrace.version | quote }}
        {{- end }}
        datakit/logs: >-
          [{"disable":false,"source":"java_selfheal_demo","service":"{{ $service.name }}","multiline_match":"^\\d{4}-\\d{2}-\\d{2} "}]
    spec:
      serviceAccountName: {{ include "observability-demo.fullname" $ }}-{{ if and (eq $service.name "order-service") $.Values.logViewer.enabled }}log-reader{{ else }}app{{ end }}
      automountServiceAccountToken: {{ and (eq $service.name "order-service") $.Values.logViewer.enabled }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $.Values.ddtrace.mode "initContainer" }}
      initContainers:
        - name: ddtrace-init
          image: {{ printf "%s:%s" $.Values.ddtrace.imageRepository $.Values.ddtrace.version | quote }}
          command: ["sh", "-ec"]
          args: ["cp /datadog-init/dd-java-agent.jar /datadog-lib/agent.tmp && chmod 0444 /datadog-lib/agent.tmp && mv -f /datadog-lib/agent.tmp /datadog-lib/dd-java-agent.jar"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $.Values.ddtrace.resources | nindent 12 }}
          volumeMounts:
            - name: ddtrace-agent
              mountPath: /datadog-lib
      {{- end }}
      containers:
        - name: {{ $service.name }}
          image: {{ include "observability-demo.image" (dict "root" $ "service" $service.name) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ $service.port }}
              protocol: TCP
          env:
            {{- if eq $.Values.ddtrace.mode "initContainer" }}
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/datadog-lib/dd-java-agent.jar"
            {{- end }}
            - name: DD_SERVICE
              value: {{ $service.name | quote }}
            - name: DD_ENV
              value: {{ $.Values.environment | quote }}
            - name: DD_VERSION
              value: {{ $.Values.image.tag | quote }}
            - name: PROJECT_TAG
              value: {{ $.Values.observability.project | quote }}
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "9529"
            - name: DD_INTEGRATION_JDBC_DATASOURCE_ENABLED
              value: "true"
            - name: DD_JMXFETCH_ENABLED
              value: "true"
            - name: DD_JMXFETCH_STATSD_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_JMXFETCH_STATSD_PORT
              value: "8125"
            - name: DD_PROFILING_ENABLED
              value: "true"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_TRACE_HEADER_TAGS
              value: "x-key-request:key_request,x-business-request-id:biz_request_id,x-demo-language:language"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTAINER_NAME
              value: {{ $service.name | quote }}
            - name: DD_TAGS
              value: {{ $ddTags | quote }}
            {{- if eq $service.name "gateway-service" }}
            - name: ORDER_URL
              value: http://{{ include "observability-demo.fullname" $ }}-order-service:8080
            - name: GAME_URL
              value: http://{{ include "observability-demo.fullname" $ }}-game-service:8084
            {{- else if eq $service.name "game-service" }}
            - name: RUM_ENABLED
              value: {{ $.Values.rum.enabled | quote }}
            - name: RUM_GAME_APPLICATION_ID
              value: {{ $.Values.rum.gameApplicationId | quote }}
            - name: RUM_GAME_SERVICE
              value: {{ $.Values.rum.gameService | quote }}
            - name: DATAKIT_PROVIDER
              value: {{ $.Values.datakit.provider | quote }}
            {{- else if eq $service.name "order-service" }}
            - name: MYSQL_URL
              value: jdbc:mysql://{{ include "observability-demo.fullname" $ }}-mysql:3306/{{ $.Values.mysql.database }}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&connectTimeout=3000&socketTimeout=5000
            - name: MYSQL_USER
              value: {{ $.Values.mysql.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "observability-demo.secretName" $ }}
                  key: {{ $.Values.secretKeys.mysqlPassword }}
            - name: INVENTORY_URL
              value: http://{{ include "observability-demo.fullname" $ }}-inventory-service:8081
            - name: PAYMENT_URL
              value: http://{{ include "observability-demo.fullname" $ }}-payment-service:8082
            - name: ORDER_URL
              value: http://{{ include "observability-demo.fullname" $ }}-order-service:8080
            - name: KUBERNETES_LOG_READER_ENABLED
              value: {{ $.Values.logViewer.enabled | quote }}
            - name: RUM_ENABLED
              value: {{ $.Values.rum.enabled | quote }}
            - name: RUM_APPLICATION_ID
              value: {{ if $.Values.rum.enabled }}{{ required "rum.applicationId is required when rum.enabled=true" $.Values.rum.applicationId | quote }}{{ else }}""{{ end }}
            - name: RUM_GAME_APPLICATION_ID
              value: {{ if $.Values.rum.enabled }}{{ required "rum.gameApplicationId is required when rum.enabled=true" $.Values.rum.gameApplicationId | quote }}{{ else }}""{{ end }}
            - name: RUM_SERVICE
              value: {{ $.Values.rum.service | quote }}
            - name: RUM_GAME_SERVICE
              value: {{ $.Values.rum.gameService | quote }}
            - name: MOBILE_RUM_ENABLED
              value: {{ $.Values.rum.mobile.enabled | quote }}
            - name: MOBILE_RUM_ANDROID_APPLICATION_ID
              value: {{ $.Values.rum.mobile.androidApplicationId | quote }}
            - name: MOBILE_RUM_IOS_APPLICATION_ID
              value: {{ $.Values.rum.mobile.iosApplicationId | quote }}
            - name: MOBILE_RUM_SERVICE
              value: {{ $.Values.rum.mobile.service | quote }}
            - name: MOBILE_RUM_SESSION_REPLAY_ENABLED
              value: {{ $.Values.rum.mobile.sessionReplayEnabled | quote }}
            - name: DATAKIT_RUM_URL
              value: http://$(DD_AGENT_HOST):9529
            - name: DATAKIT_PROVIDER
              value: {{ $.Values.datakit.provider | quote }}
            - name: OBSERVABILITY_CONSOLE_URL
              value: {{ $.Values.observabilityConsole.url | quote }}
            - name: OBSERVABILITY_WORKSPACE_ID
              value: {{ $.Values.observabilityConsole.workspaceId | quote }}
            - name: MOBILE_DEVICE_PLAYER_URL
              value: {{ $.Values.mobileDevice.playerUrl | quote }}
            - name: MOBILE_DEVICE_PLAYER_VERSION
              value: {{ $.Values.mobileDevice.playerVersion | default "" | quote }}
            - name: MOBILE_DEVICE_APK_VERSION
              value: {{ $.Values.mobileDevice.apkVersion | default "" | quote }}
            - name: MOBILE_DEVICE_APK_MIN_ANDROID_VERSION
              value: {{ $.Values.mobileDevice.apkMinAndroidVersion | default "7.0" | quote }}
            - name: DEMO_LOG_DIRECTORY
              value: /var/log/observability-demo
            {{- else if eq $service.name "inventory-service" }}
            - name: REDIS_HOST
              value: {{ include "observability-demo.fullname" $ }}-redis
            - name: REDIS_PORT
              value: "6379"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources.java | nindent 12 }}
          volumeMounts:
            {{- if eq $.Values.ddtrace.mode "initContainer" }}
            - name: ddtrace-agent
              mountPath: /datadog-lib
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if eq $.Values.ddtrace.mode "initContainer" }}
        - name: ddtrace-agent
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
