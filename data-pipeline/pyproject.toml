[project]
name = "mall-data-pipeline"
version = "0.1.1"
description = "Order cleansing and sales aggregation with durable OpenLineage events"
requires-python = ">=3.12"
dependencies = [
  "openlineage-python==1.54.0",
  "PyMySQL[rsa]==1.2.3",
  "requests>=2.32.4,<3",
]

[project.scripts]
mall-data-pipeline = "mall_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mall_pipeline"]

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4,<5", "ruff>=0.12,<1", "mypy>=1.15,<2", "types-requests", "types-PyMySQL", "PyYAML>=6,<7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable MySQL database"]
