<!doctype html>

<head>

  <title data-i18n="sceneBookstoreTitle">商城 Demo</title>
  <link rel="icon" href="data:," />
  <script>
    (() => {
      const params = new URL(window.location.href).searchParams;
      const supportedThemes = new Set(['colorful', 'white']);
      let demoTheme = params.get('theme');
      if (!supportedThemes.has(demoTheme)) {
        try {
          demoTheme = window.localStorage.getItem('mall-demo-theme');
        } catch (_) {
          demoTheme = 'colorful';
        }
      }
      document.documentElement.dataset.businessScene = params.get('scene') || 'bookstore';
      document.documentElement.dataset.previewMode = params.get('view') === 'mobile' ? 'mobile' : 'web';
      document.documentElement.dataset.demoTheme = supportedThemes.has(demoTheme) ? demoTheme : 'colorful';
    })();
  </script>
  <script src="assets/checkout-sourcemap-fault.min.js?v=20260805-bookstore-v41"></script>

<body>

  <script>
    const I18N = window.SelfhealI18n;
    let PROJECT_NAME = 'mall-demo';
    const apiPrefix = window.location.pathname.startsWith('/selfheal') ? '/selfheal' : '';
    const rumResourceContexts = [];
    const PREVIEW_DISPLAY_URL = 'https://demo.dataflux.cn';
    const DEMO_THEME_STORAGE_KEY = 'mall-demo-theme';
    const DEMO_THEMES = new Set(['colorful', 'white']);
    const STORE_PAGES = new Set(['home', 'path', 'detail', 'cart']);
    const LEGACY_STORE_PAGE_ALIASES = Object.freeze({ categories: 'home', technology: 'detail', purchase: 'cart' });
    const ORDER_BACKEND_SKU = 'sku-1001';
    const SWIPE_BACK_MIN_DISTANCE = 72;
    const SWIPE_BACK_MAX_VERTICAL_DISTANCE = 48;
    const SWIPE_BACK_MAX_DURATION_MS = 700;
    const BROWSER_SESSION_PERSISTENCE = 'local-storage';
    const BROWSER_SDK_ORIGINS = Object.freeze({
      guance: 'https://static.guance.com',
      truewatch: 'https://static.truewatch.com',
    });
    const TOPIC_ICONS = Object.freeze({
      all: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"></path><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z"></path>',
      foundation: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>',
      tracing: '<circle cx="5" cy="17" r="2"></circle><circle cx="12" cy="7" r="2"></circle><circle cx="19" cy="15" r="2"></circle><path d="m6.5 15.5 4-6.5M13.8 8.3l3.5 5"></path>',
      reliability: '<path d="M12 3 4 6v6c0 5 3.4 8 8 10 4.6-2 8-5 8-10V6l-8-3Z"></path><path d="m8.5 12 2.2 2.2 4.8-5"></path>',
      team: '<circle cx="8" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M2.5 20a5.5 5.5 0 0 1 11 0M13 19a4.5 4.5 0 0 1 8.5 0"></path>',
      systems: '<rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="9" y="15" width="6" height="6" rx="1"></rect><path d="M7 10v2h10v-2M12 12v3"></path>',
    });
    const initialPreviewParams = new URL(window.location.href).searchParams;
    const initialBookId = I18N.bookById(initialPreviewParams.get('book')).id;
    const state = {
      busy: false,
      rumReady: false,
      browserLogsReady: false,
      rumApplicationId: '',
      rumViewId: '',
      rumSessionId: '',
      activeClientFault: null,
      language: I18N.setLanguage(I18N.detectLanguage(), { updateUrl: true }),
      demoTheme: DEMO_THEMES.has(document.documentElement.dataset.demoTheme) ? document.documentElement.dataset.demoTheme : 'colorful',
      businessScene: initialPreviewParams.get('scene') || 'bookstore',
      previewMode: initialPreviewParams.get('view') === 'mobile' ? 'mobile' : 'web',
      storePage: normalizeStorePage(initialPreviewParams.get('page')),
      storeHistoryIndex: Number.isFinite(Number(window.history.state?.storeIndex)) ? Number(window.history.state.storeIndex) : 0,
      pendingHistoryTrigger: null,
      swipeBackStart: null,
      currentBookId: initialBookId,
      query: '',
      activeTopic: 'all',
      sort: 'recommended',
      detailTab: 'overview',
      detailQuantity: 1,
      cart: new Map([['observability-engineering', 1]]),
      selectedCart: new Set(['observability-engineering']),
    };

    const els = {
      storeHome: document.getElementById('storeHome'),
      homeBookCover: document.getElementById('homeBookCover'),
      homeProduct: document.getElementById('homeProduct'),
      brandTitle: document.getElementById('brandTitle'),
      brandSubtitle: document.getElementById('brandSubtitle'),
      storeSearch: document.getElementById('storeSearch'),
      clearSearch: document.getElementById('clearSearch'),
      languageToggle: document.getElementById('languageToggle'),
      serviceStrip: document.getElementById('serviceStrip'),
      catalogTitle: document.getElementById('catalogTitle'),
      catalogCount: document.getElementById('catalogCount'),
      topicList: document.getElementById('topicList'),
      bookGrid: document.getElementById('bookGrid'),
      catalogEmpty: document.getElementById('catalogEmpty'),
      sortControl: document.getElementById('sortControl'),
      pathContent: document.getElementById('pathContent'),
      bookDetail: document.getElementById('bookDetail'),
      cartHeading: document.getElementById('cartHeading'),
      cartToolbar: document.getElementById('cartToolbar'),
      cartEmptyTitle: document.getElementById('cartEmptyTitle'),
      cartEmptyHint: document.getElementById('cartEmptyHint'),
      cartBadge: document.getElementById('cartBadge'),
      mobileCartBadge: document.getElementById('mobileCartBadge'),
      mobileBottomNav: document.getElementById('mobileBottomNav'),
      bagEmpty: document.getElementById('bagEmpty'),
      bagFilled: document.getElementById('bagFilled'),
      bagItem: document.getElementById('bagItem'),
      bagSubtotal: document.getElementById('bagSubtotal'),
      selectedProduct: document.getElementById('selectedProduct'),
      phoneTotal: document.getElementById('phoneTotal'),
      phoneToast: document.getElementById('phoneToast'),
      phoneToastTitle: document.getElementById('phoneToastTitle'),
      phoneToastDetail: document.getElementById('phoneToastDetail'),
      purchaseLoading: document.getElementById('purchaseLoading'),
      purchaseLoadingTitle: document.getElementById('purchaseLoadingTitle'),
      purchaseLoadingDetail: document.getElementById('purchaseLoadingDetail'),
      sku: document.getElementById('sku'),
      amountCent: document.getElementById('amountCent'),
      submitBtn: document.getElementById('submitBtn'),
      trafficBtn: document.getElementById('trafficBtn'),
      storeNav: document.querySelector('.store-nav'),
      shopThemePicker: document.getElementById('shopThemePicker'),
      shopThemeTrigger: document.getElementById('shopThemeTrigger'),
      currentThemeSwatch: document.getElementById('currentThemeSwatch'),
    };

    function t(key, params) {
      return I18N.t(key, params, state.language);
    }

    function s(key, params) {
      return I18N.storeT(key, params, state.language);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setThemeMenuOpen(open) {
      if (!els.shopThemePicker || !els.shopThemeTrigger) return;
      els.shopThemePicker.dataset.open = open ? 'true' : 'false';
      els.shopThemeTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function renderDemoThemePicker() {
      if (!els.shopThemePicker) return;
      els.shopThemePicker.querySelectorAll('[data-demo-theme]').forEach((button) => {
        const active = button.dataset.demoTheme === state.demoTheme;
        button.classList.toggle('active', active);
        button.setAttribute('aria-checked', active ? 'true' : 'false');
      });
      if (els.currentThemeSwatch) {
        els.currentThemeSwatch.className = `shop-theme-swatch ${state.demoTheme}`;
      }
    }

    function setDemoTheme(theme, options = {}) {
      state.demoTheme = DEMO_THEMES.has(theme) ? theme : 'colorful';
      document.documentElement.dataset.demoTheme = state.demoTheme;
      renderDemoThemePicker();
      renderProducts();
      renderStorePage({ track: false });
      setThemeMenuOpen(false);
      if (options.persist !== false) {
        try {
          localStorage.setItem(DEMO_THEME_STORAGE_KEY, state.demoTheme);
        } catch (_) {
          // localStorage can be unavailable in private browsing contexts.
        }
      }
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('theme', state.demoTheme);
        window.history.replaceState(window.history.state || {}, '', url);
      } catch (_) {
        // Embedded history updates may be restricted by the browser.
      }
      if (options.notify !== false) {
        postToParent('demo-theme-changed', { theme: state.demoTheme });
      }
    }

    function normalizeStorePage(page) {
      const normalized = LEGACY_STORE_PAGE_ALIASES[page] || page;
      return STORE_PAGES.has(normalized) ? normalized : 'home';
    }

    function storePageUrl(page) {
      const url = new URL(window.location.href);
      const nextPage = normalizeStorePage(page);
      url.searchParams.set('page', nextPage);
      if (nextPage === 'detail') url.searchParams.set('book', state.currentBookId);
      else url.searchParams.delete('book');
      return url;
    }

    function initializeStoreHistory() {
      state.storePage = normalizeStorePage(state.storePage);
      state.storeHistoryIndex = Number.isFinite(Number(window.history.state?.storeIndex))
        ? Number(window.history.state.storeIndex)
        : 0;
      window.history.replaceState({
        ...(window.history.state || {}),
        storePage: state.storePage,
        storeIndex: state.storeHistoryIndex,
      }, '', storePageUrl(state.storePage));
    }

    function localizedBook(book) {
      return I18N.getBookText(book, state.language);
    }

    function formatPrice(amountCent) {
      return I18N.formatPrice(amountCent, state.language);
    }

    function coverStyle(book) {
      if (!book.cover) return '';
      return `--cover-bg:${book.cover[0]};--cover-ink:${book.cover[1]};--cover-accent:${book.cover[2]};--cover-art:${book.cover[3]}`;
    }

    function coverMarkup(book, className = '') {
      const text = localizedBook(book);
      const image = book.image ? (state.language === 'en' && book.imageEn ? book.imageEn : book.image) : '';
      if (image) {
        return `<span class="book-cover ${className}"><img src="${image}" alt="${escapeHtml(text.title)}" loading="eager" decoding="async"></span>`;
      }
      return `<span class="book-cover css-cover ${className}" style="${coverStyle(book)}" role="img" aria-label="${escapeHtml(text.title)}">
        <span class="cover-kicker">${escapeHtml(text.badge)}</span>
        <strong class="cover-title">${escapeHtml(text.shortTitle).replaceAll('\n', '<br>')}</strong>
        <span class="cover-author">${escapeHtml(text.authorShort)}</span>
      </span>`;
    }

    function currentBook() {

            <h1>${escapeHtml(text.title)}</h1>
            <p class="detail-english-title">${escapeHtml(text.englishTitle)}</p>
            <div class="detail-rating"><b>★★★★★</b><strong>${s('rating', { rating: book.rating })}</strong><span>${s('editorPick')}</span></div>
            <p class="detail-description">${escapeHtml(text.description)}</p>
            <p class="detail-author"><strong>${s('authorPrefix')}:</strong> ${escapeHtml(text.author)}</p>
            <div class="detail-meta">${[[s('published'), text.published], [s('pages'), text.pages], [s('level'), text.level], [s('publisher'), text.publisher], [s('isbn'), text.isbn], ['SKU', `obs-${book.id}`]].map(([label, value]) => `<span class="detail-meta-item"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></span>`).join('')}</div>
          </div>
          <aside class="purchase-panel">
            <span class="purchase-format">${s('format')} · ${s('commerceProduct')}</span>
            <div class="purchase-price">${formatPrice(book.amountCent)}</div>
            <div class="purchase-benefit"><i>✓</i><span>${s('inStock')}</span></div>
            <div class="purchase-benefit"><i>✓</i><span>${s('authenticity')}</span></div>
            <div class="quantity-row"><span>${s('purchaseQuantity')}</span><div class="quantity-stepper"><button type="button" data-detail-quantity="-1" aria-label="${s('decrease')}">−</button><span>${state.detailQuantity}</span><button type="button" data-detail-quantity="1" aria-label="${s('increase')}">＋</button></div></div>
            <div class="purchase-actions"><button class="primary-button" type="button" data-add-book="${book.id}">${isInCart(book.id) ? s('inCart') : s('addCart')}</button><button class="secondary-button" type="button" data-buy-book="${book.id}">${s('buyNow')}</button></div>

        <div class="detail-body">
          <section class="detail-content-card">
            <div class="detail-tabs" role="tablist"><button class="tab-button ${state.detailTab === 'overview' ? 'is-active' : ''}" type="button" data-detail-tab="overview">${s('overview')}</button><button class="tab-button ${state.detailTab === 'chapters' ? 'is-active' : ''}" type="button" data-detail-tab="chapters">${s('contents')}</button><button class="tab-button ${state.detailTab === 'audience' ? 'is-active' : ''}" type="button" data-detail-tab="audience">${s('audience')}</button></div>
            <div class="tab-panel">${detailPanel}</div>

            <section class="detail-side-card"><h2>${s('suggestedPath')}</h2><div class="reading-path">${I18N.readingStages.map((stage, index) => { const stageText = stage[state.language] || stage.zh; return `<article class="reading-step"><span>${index + 1}</span><div><strong>${escapeHtml(stageText[0])}</strong><p>${escapeHtml(stageText[1])}</p></div></article>`; }).join('')}</div></section>

          </aside>

    function renderPath() {
      if (!els.pathContent) return;
      els.pathContent.innerHTML = `
        <header class="path-hero"><span class="section-eyebrow">${s('pathEyebrow')}</span><h1>${s('pathTitle')}</h1><p>${s('pathDescription')}</p></header>
        <div class="path-stages">${I18N.readingStages.map((stage, index) => {
          const stageText = stage[state.language] || stage.zh;
          return `<article class="path-stage">
            <div class="stage-number">0${index + 1}</div>
            <div class="stage-copy"><h2>${s('stage', { index: index + 1 })} · ${escapeHtml(stageText[0])}</h2><p>${escapeHtml(stageText[1])}</p></div>
            <div class="stage-books">${stage.books.map((bookId) => {
              const book = I18N.bookById(bookId);
              const text = localizedBook(book);
              return `<button type="button" data-book-id="${book.id}">${coverMarkup(book, 'stage-cover')}<span class="stage-book-copy"><strong>${escapeHtml(text.title)}</strong></span></button>`;
            }).join('')}</div>
          </article>`;
        }).join('')}</div>`;

    function renderStorePage(options = {}) {
      state.storePage = normalizeStorePage(state.storePage);
      els.storeHome.dataset.storePage = state.storePage;
      document.querySelectorAll('[data-store-route]').forEach((link) => {
          const active = link.dataset.storeRoute === state.storePage;
          link.classList.toggle('active', active);
          if (active) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
      });
      renderStoreCopy();
      if (state.storePage === 'home') renderHomeProduct();
      if (state.storePage === 'path') renderPath();
      if (state.storePage === 'detail') renderBookDetail();
      renderCart();
      applyPreviewObservabilityContext();
      if (options.track !== false && options.previousPage && options.previousPage !== state.storePage) {
        addRumAction('business_navigate_bookstore', {
          from_page: options.previousPage,
          to_page: state.storePage,
          trigger: options.trigger || 'navigation',
        });
      }
    }

    function navigateStorePage(page, options = {}) {
      if (options.bookId) {
        state.currentBookId = I18N.bookById(options.bookId).id;
        state.detailTab = 'overview';
        state.detailQuantity = 1;
      }
      const nextPage = normalizeStorePage(page);
      const previousPage = state.storePage;
      const historyMode = options.historyMode || (nextPage === previousPage ? 'replace' : 'push');
      if (historyMode === 'push') {
        state.storeHistoryIndex = Math.max(0, Number(state.storeHistoryIndex) || 0) + 1;
        window.history.pushState({
          storePage: nextPage,
          storeIndex: state.storeHistoryIndex,
        }, '', storePageUrl(nextPage));
      } else {
        window.history.replaceState({
          ...(window.history.state || {}),
          storePage: nextPage,
          storeIndex: state.storeHistoryIndex,
        }, '', storePageUrl(nextPage));
      }
      state.storePage = nextPage;
      renderStorePage({
        previousPage,
        trigger: options.trigger,
        track: options.track,
      });
    }

    function openBookDetail(bookId, trigger = 'open_book_detail') {
      navigateStorePage('detail', { bookId, trigger });
    }

    function goBackStorePage(trigger = 'history_back') {
      const historyIndex = Number(window.history.state?.storeIndex) || 0;
      if (historyIndex > 0) {
        state.pendingHistoryTrigger = trigger;
        window.history.back();
        return;
      }
      navigateStorePage('home', { historyMode: 'replace', trigger: `${trigger}_fallback` });
    }

    function handleSwipeBackStart(event) {
      state.swipeBackStart = null;
      if (state.previewMode !== 'mobile' || state.storePage === 'home' || event.touches.length !== 1) return;
      if (event.target.closest('a, button, input, select, textarea, summary, details, [role="button"], [role="link"]')) return;
      const touch = event.touches[0];
      state.swipeBackStart = {
        x: touch.clientX,
        y: touch.clientY,
        startedAt: Date.now(),
      };
    }

    function handleSwipeBackEnd(event) {
      const start = state.swipeBackStart;
      state.swipeBackStart = null;
      if (!start || state.previewMode !== 'mobile' || state.storePage === 'home' || event.changedTouches.length !== 1) return;
      const touch = event.changedTouches[0];
      const deltaX = touch.clientX - start.x;
      const deltaY = Math.abs(touch.clientY - start.y);
      const duration = Date.now() - start.startedAt;
      if (deltaX > -SWIPE_BACK_MIN_DISTANCE
          || deltaY > SWIPE_BACK_MAX_VERTICAL_DISTANCE
          || duration > SWIPE_BACK_MAX_DURATION_MS) return;
      goBackStorePage('mobile_swipe_back');
    }

    function applyPreviewObservabilityContext() {
      document.documentElement.dataset.businessScene = state.businessScene;
      document.documentElement.dataset.previewMode = state.previewMode;
      const cart = checkoutSnapshot();
      if (state.rumReady && window.DATAFLUX_RUM?.setGlobalContextProperty) {
        window.DATAFLUX_RUM.setGlobalContextProperty('business_scene', state.businessScene);
        window.DATAFLUX_RUM.setGlobalContextProperty('preview_mode', state.previewMode);
        window.DATAFLUX_RUM.setGlobalContextProperty('preview_url', PREVIEW_DISPLAY_URL);
        window.DATAFLUX_RUM.setGlobalContextProperty('store_page', state.storePage);
        window.DATAFLUX_RUM.setGlobalContextProperty('book_id', state.currentBookId);
        window.DATAFLUX_RUM.setGlobalContextProperty('cart_total_copies', cart.totalCopies);
        window.DATAFLUX_RUM.setGlobalContextProperty('cart_amount_cent', cart.amountCent);
      }
      if (state.browserLogsReady && window.DATAFLUX_LOGS?.setGlobalContextProperty) {
        window.DATAFLUX_LOGS.setGlobalContextProperty('business_scene', state.businessScene);
        window.DATAFLUX_LOGS.setGlobalContextProperty('preview_mode', state.previewMode);
        window.DATAFLUX_LOGS.setGlobalContextProperty('preview_url', PREVIEW_DISPLAY_URL);
        window.DATAFLUX_LOGS.setGlobalContextProperty('store_page', state.storePage);
        window.DATAFLUX_LOGS.setGlobalContextProperty('book_id', state.currentBookId);
        window.DATAFLUX_LOGS.setGlobalContextProperty('cart_total_copies', cart.totalCopies);
        window.DATAFLUX_LOGS.setGlobalContextProperty('cart_amount_cent', cart.amountCent);
      }
    }

    function setPreviewContext(sceneId, view) {
      state.businessScene = sceneId || state.businessScene || 'bookstore';
      state.previewMode = view === 'mobile' ? 'mobile' : 'web';
      applyPreviewObservabilityContext();
    }

    function postToParent(type, payload = {}) {
      if (!window.parent || window.parent === window) return;
      window.parent.postMessage({
        source: 'mall-shop-demo',
        type,
        payload,
      }, window.location.origin);
    }

    function shortJson(value) {
      const text = typeof value === 'string' ? value : JSON.stringify(value);
      return text && text.length > 520 ? `${text.slice(0, 520)}...` : text;
    }

    function shortId(value) {
      if (!value) return '-';
      return value.length > 18 ? `${value.slice(0, 8)}...${value.slice(-6)}` : value;
    }

    function selectedProduct() {
      return currentBook();
    }

    function selectedProductText() {
      return I18N.getProductText(selectedProduct(), state.language, state.demoTheme);
    }

    function selectedCartLines() {
      return [...state.selectedCart]
        .filter((bookId) => Number(state.cart.get(bookId) || 0) > 0)
        .map((bookId) => {
          const book = I18N.bookById(bookId);
          const text = localizedBook(book);
          const quantity = Math.max(1, Number(state.cart.get(bookId) || 1));
          return { book, text, quantity, lineAmountCent: book.amountCent * quantity };
        });
    }

    function checkoutSnapshot() {
      const lines = selectedCartLines();
      const totalCopies = lines.reduce((total, line) => total + line.quantity, 0);
      const amountCent = lines.reduce((total, line) => total + line.lineAmountCent, 0);
      return {
        lines,
        lineCount: lines.length,
        totalCopies,
        amountCent,
        bookIds: lines.map((line) => line.book.id),
        titles: lines.map((line) => line.text.title),
        quantities: lines.map((line) => line.quantity),
        productLabel: lines.map((line) => line.text.title).join(' / '),
      };
    }

    function currentAmountCent() {
      return Math.max(1, checkoutSnapshot().amountCent || selectedProduct().amountCent || 1);
    }

    function setBusy(value) {
      state.busy = value;
      [els.submitBtn, els.trafficBtn].forEach((button) => {
        if (!button) return;
        button.disabled = value;
        button.setAttribute('aria-busy', value ? 'true' : 'false');
      });
      if (!value && checkoutSnapshot().totalCopies === 0) {
        els.submitBtn.disabled = true;
        els.trafficBtn.disabled = true;
      }
    }

    function showPurchaseLoading(title, detail) {
      hidePhoneResult();
      els.purchaseLoadingTitle.textContent = title || '';
      els.purchaseLoadingDetail.textContent = detail || '';
      els.purchaseLoading.hidden = false;
    }

    function hidePurchaseLoading() {
      els.purchaseLoading.hidden = true;
      els.purchaseLoadingTitle.textContent = '';
      els.purchaseLoadingDetail.textContent = '';
    }

    let phoneToastTimer = null;

    function hidePhoneResult() {
      if (phoneToastTimer) {
        clearTimeout(phoneToastTimer);
        phoneToastTimer = null;
      }
      els.phoneToast.className = 'phone-toast';
      els.phoneToast.hidden = true;
      els.phoneToastTitle.textContent = '';
      els.phoneToastDetail.textContent = '';
    }

    function setPhoneResult(kind, title, detail, options = {}) {
      if (!title && !detail) {
        hidePhoneResult();
        return;
      }
      if (phoneToastTimer) {
        clearTimeout(phoneToastTimer);
        phoneToastTimer = null;
      }
      const toastKind = kind || 'info';
      els.phoneToast.hidden = false;
      els.phoneToast.className = `phone-toast ${toastKind} show`;
      els.phoneToastTitle.textContent = title || '';
      els.phoneToastDetail.textContent = detail || '';
      const shouldAutoHide = toastKind !== 'processing' && options.sticky !== true;
      if (shouldAutoHide) {
        phoneToastTimer = setTimeout(hidePhoneResult, options.durationMs || 4000);
      }
    }

    function log(message, options = {}) {
      postToParent('shop-log', {
        title: options.title || t('shopLogTitle'),
        message,
        status: options.status || 'info',
      });
      emitBrowserLog(message, options.context || {}, options.status || 'info');
    }

    function emitBrowserLog(message, context = {}, status = 'info') {
      if (!state.browserLogsReady || !window.DATAFLUX_LOGS?.logger?.log) return;
      window.DATAFLUX_LOGS.logger.log(message, {
        project: PROJECT_NAME,
        demo: 'selfheal-business',
        page: 'shop',
        ...context,
      }, status);
    }

    function newBizRequestId() {
      if (window.crypto && window.crypto.randomUUID) {
        return `biz-${window.crypto.randomUUID()}`;
      }
      return `biz-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function newFaultTriggerId() {
      if (window.crypto && window.crypto.randomUUID) {
        return `fault-trigger-${window.crypto.randomUUID()}`;
      }
      return `fault-trigger-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function selectedKeyRequest() {
      return 'checkout_submit_order';
    }

    function buildHeaders(keyRequestOverride) {
      const keyRequest = keyRequestOverride || selectedKeyRequest();
      const bizRequestId = newBizRequestId();
      const cart = checkoutSnapshot();
      const baggage = [
        `project=${encodeURIComponent(PROJECT_NAME)}`,
        `key_request=${encodeURIComponent(keyRequest)}`,
        'biz_chain=selfheal_checkout',
        `biz_request_id=${encodeURIComponent(bizRequestId)}`,
        `book_ids=${encodeURIComponent(cart.bookIds.join('|') || state.currentBookId)}`,
        `book_copies=${encodeURIComponent(cart.totalCopies || 1)}`,
      ].join(',');
      return {
        bizRequestId,
        keyRequest,
        headers: {
          'X-Key-Request': keyRequest,
          'X-Business-Request-Id': bizRequestId,
          'X-Biz-Chain': 'selfheal_checkout',
          'X-Book-Ids': cart.bookIds.join(',') || state.currentBookId,
          'X-Book-Copies': String(cart.totalCopies || 1),
          baggage,
        },
      };
    }

    function normalizeRumResourcePath(url) {
      try {
        return new URL(url, window.location.origin).pathname;
      } catch (_) {
        return String(url).split('?')[0];
      }
    }

    function rememberRumResourceContext(url, context = {}) {
      const item = {
        path: normalizeRumResourcePath(url),
        createdAt: Date.now(),
        ...context,
      };
      rumResourceContexts.unshift(item);
      rumResourceContexts.splice(24);
      window.__selfhealLastRumResourceContext = item;
    }

    function pickRumResourceContext(event) {
      if (event?.type !== 'resource' || !event.resource?.url) return null;
      const path = normalizeRumResourcePath(event.resource.url);
      const now = Date.now();
      return rumResourceContexts.find((item) => {
        if (now - item.createdAt > 30000) return false;
        return path === item.path || path.startsWith(`${item.path}/`);
      }) || null;
    }

    function enrichRumEvent(event) {
      if (event?.view?.id) state.rumViewId = event.view.id;
      if (event?.session?.id) state.rumSessionId = event.session.id;
      event.context = event.context || {};
      event.context.project = PROJECT_NAME;
      event.context.demo = 'selfheal-business';
      event.context.page = 'shop';
      event.context.business_scene = state.businessScene;
      event.context.preview_mode = state.previewMode;
      event.context.preview_url = PREVIEW_DISPLAY_URL;
      event.context.store_page = state.storePage;
      event.context.book_id = state.currentBookId;
      const cartSnapshot = checkoutSnapshot();
      event.context.cart_total_copies = cartSnapshot.totalCopies;
      event.context.cart_amount_cent = cartSnapshot.amountCent;
      const activeFaultContext = window.__activeFaultContext || {};
      if (activeFaultContext.fault_id && (event.type === 'error' || event.type === 'action')) {
        event.context.fault_id = event.context.fault_id || activeFaultContext.fault_id;
        event.context.fault_layer = event.context.fault_layer || activeFaultContext.fault_layer;
        event.context.fault_kind = event.context.fault_kind || activeFaultContext.fault_kind;
        event.context.fault_target = event.context.fault_target || activeFaultContext.fault_target;
        if (activeFaultContext.fault_trigger_id) event.context.fault_trigger_id = event.context.fault_trigger_id || activeFaultContext.fault_trigger_id;
        if (activeFaultContext.fault_triggered_at) event.context.fault_triggered_at = event.context.fault_triggered_at || activeFaultContext.fault_triggered_at;
        if (activeFaultContext.rum_view_id) event.context.rum_view_id = event.context.rum_view_id || activeFaultContext.rum_view_id;
        if (activeFaultContext.rum_session_id) event.context.rum_session_id = event.context.rum_session_id || activeFaultContext.rum_session_id;
        if (event.type === 'error') {
          event.context.biz_operation = event.context.biz_operation || activeFaultContext.operation || 'observe_frontend_error';
          event.context.error_type = event.context.error_type || activeFaultContext.error_type || 'frontend_null_pointer';
          event.context.code_file = event.context.code_file || activeFaultContext.code_file || 'shop.html';
          event.context.code_function = event.context.code_function || activeFaultContext.code_function || 'simulatePurchaseNullPointer';
          if (activeFaultContext.runtime_file) event.context.runtime_file = event.context.runtime_file || activeFaultContext.runtime_file;
          if (activeFaultContext.sourcemap_file) event.context.sourcemap_file = event.context.sourcemap_file || activeFaultContext.sourcemap_file;
        }
      }
      const rumContext = pickRumResourceContext(event);
      if (rumContext) {
        event.context.biz_chain = rumContext.bizChain || 'selfheal_checkout';
        if (rumContext.keyRequest) event.context.key_request = rumContext.keyRequest;
        if (rumContext.bizRequestId) event.context.biz_request_id = rumContext.bizRequestId;
        if (rumContext.operation) event.context.biz_operation = rumContext.operation;
        if (rumContext.product) event.context.product = rumContext.product;
        if (rumContext.sku) event.context.sku = rumContext.sku;
        if (rumContext.bookIds) event.context.book_ids = rumContext.bookIds;
        if (rumContext.bookTitles) event.context.book_titles = rumContext.bookTitles;
        if (rumContext.bookQuantities) event.context.book_quantities = rumContext.bookQuantities;
        if (rumContext.cartLineCount != null) event.context.cart_line_count = rumContext.cartLineCount;
        if (rumContext.cartTotalCopies != null) event.context.cart_total_copies = rumContext.cartTotalCopies;
        if (rumContext.cartAmountCent != null) event.context.cart_amount_cent = rumContext.cartAmountCent;
        if (rumContext.faultId) event.context.fault_id = rumContext.faultId;
        if (rumContext.faultLayer) event.context.fault_layer = rumContext.faultLayer;
        if (rumContext.faultKind) event.context.fault_kind = rumContext.faultKind;
        if (rumContext.faultTarget) event.context.fault_target = rumContext.faultTarget;
        if (rumContext.faultTriggerId) event.context.fault_trigger_id = rumContext.faultTriggerId;
        if (rumContext.faultTriggeredAt) event.context.fault_triggered_at = rumContext.faultTriggeredAt;
      }
      return true;
    }

    function addRumAction(name, context) {
      if (window.DATAFLUX_RUM && window.DATAFLUX_RUM.addAction) {
        window.DATAFLUX_RUM.addAction(name, context || {});
      }
    }

    function isFrontendErrorFault(context) {
      return context?.fault_id === 'frontend_click_error' || context?.fault_id === 'frontend_sourcemap_error';
    }

    function clientFaultContext(scenario) {
      const base = {
        fault_id: scenario.id,
        fault_layer: scenario.layer,
        fault_kind: scenario.kind,
        fault_target: scenario.target,
      };
      if (scenario.id === 'frontend_sourcemap_error') {
        return {
          ...base,
          operation: 'observe_frontend_sourcemap_error',
          error_type: 'frontend_sourcemap_null_pointer',
          code_file: 'assets/src/checkout-sourcemap-fault.js',
          code_function: 'applyCheckoutDiscount',
          runtime_file: 'assets/checkout-sourcemap-fault.min.js',
          sourcemap_file: 'assets/checkout-sourcemap-fault.min.js.map',
        };
      }
      if (scenario.id === 'frontend_slow_resource') {
        return {
          ...base,
          operation: 'fault_frontend_slow_resource',
          resource_path: '/api/demo/slow-resource',
        };
      }
      return {
        ...base,
        operation: 'observe_frontend_click_error',
        error_type: 'frontend_null_pointer',
        code_file: 'shop.html',
        code_function: 'simulatePurchaseNullPointer',
      };
    }

    function frontendErrorContext(extra = {}) {
      const context = window.__activeFaultContext || {};
      return {
        project: PROJECT_NAME,
        demo: 'selfheal-business',
        page: 'shop',
        biz_chain: 'selfheal_checkout',
        operation: context.operation || 'observe_frontend_error',

    async function requestJson(url, options = {}) {
      const { headers = {}, rumContext, ...restOptions } = options;
      const target = `${apiPrefix}${url}`;
      if (rumContext) {
        rememberRumResourceContext(target, rumContext);
      }
      const response = await fetch(target, {
        cache: 'no-store',
        ...restOptions,
        headers: {
          'Content-Type': 'application/json',
          'X-Demo-Language': state.language,
          ...headers,
        },
      });
      const text = await response.text();
      let body = text;
      try { body = JSON.parse(text); } catch (_) {}
      return { response, body };
    }

    function normalizeBackendLogItems(lines) {
      return lines.map((line) => {
        if (typeof line === 'object' && line !== null) {
          return {
            source: line.source || line.pod || line.service || 'backend',
            service: line.service || '',
            pod: line.pod || '',
            message: line.message || line.line || '',
            timestamp: line.timestamp || '',
            traceId: line.traceId || line.trace_id || '',
          };
        }
        const rawLine = String(line);
        const sourceMatch = rawLine.match(/^([^:]+):\s+([\s\S]*)$/);
        return {
          source: sourceMatch ? sourceMatch[1] : 'backend',
          service: '',
          pod: '',
          message: sourceMatch ? sourceMatch[2] : rawLine,
          timestamp: '',
          traceId: '',
        };
      });
    }

    function extractTraceIdFromText(text) {
      const match = String(text || '').match(/\btrace_id=([0-9A-Fa-f]+)\b/);
      return match ? match[1] : '';
    }

    function pickTraceIdFromBackendLogs(result, items) {
      const body = result?.body || {};
      if (body.traceId) return body.traceId;
      if (Array.isArray(body.traceIds) && body.traceIds[0]) return body.traceIds[0];
      const sourceItems = items || normalizeBackendLogItems(result?.items || []);
      for (const item of sourceItems) {
        const traceId = item.traceId || extractTraceIdFromText(item.message);
        if (traceId) return traceId;
      }
      return '';
    }

    async function fetchBackendLogs(params, requestId) {
      const { response, body } = await requestJson(`/api/demo/logs?${params.toString()}`, {
        rumContext: {
          operation: 'fetch_backend_logs',
          keyRequest: 'selfheal_log_view',
          bizChain: 'selfheal_checkout',
          bizRequestId: requestId,
        },
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const items = Array.isArray(body.items) && body.items.length > 0 ? body.items : (Array.isArray(body.lines) ? body.lines : []);
      return { items, body };
    }

    async function logBackendTraceLogs(body, bizRequestId) {
      const requestId = body?.businessRequestId || bizRequestId;
      const orderId = body?.orderId;
      if (!requestId && !orderId) return { traceId: '' };

      const params = new URLSearchParams();
      if (requestId) params.set('biz_request_id', requestId);
      if (orderId) params.set('order_id', orderId);
      params.set('limit', '12');

      try {
        let lastResult = { items: [] };
        for (let attempt = 0; attempt < 6; attempt += 1) {
          await new Promise((resolve) => setTimeout(resolve, attempt === 0 ? 350 : 500));
          lastResult = await fetchBackendLogs(params, requestId);
          if (lastResult.items.length > 0) {
            const items = normalizeBackendLogItems(lastResult.items);
            log(t('shopLogBackendFound', { requestId: requestId || orderId, count: items.length }), {
              title: t('parentLogPanel'),
              context: { operation: 'fetch_backend_logs', biz_request_id: requestId, order_id: orderId },
            });
            items.slice(0, 6).forEach((item) => {
              log(`${item.service || item.source}: ${item.message}`, {
                title: t('parentLogPanel'),
                context: { operation: 'backend_log_line', service: item.service || item.source },
                status: 'info',
              });
            });
            return { traceId: pickTraceIdFromBackendLogs(lastResult, items), items };
          }
        }
        log(t('shopLogBackendMissing', { requestId: requestId || orderId }), {
          title: t('parentLogPanel'),
          status: 'warn',
          context: { operation: 'fetch_backend_logs', biz_request_id: requestId, order_id: orderId },
        });
        return { traceId: pickTraceIdFromBackendLogs(lastResult), items: [] };
      } catch (error) {
        log(t('shopLogBackendFailed', { message: error.message }), {
          title: t('parentLogPanel'),
          status: 'warn',
          context: { operation: 'fetch_backend_logs', biz_request_id: requestId, order_id: orderId },
        });
        return { traceId: '', items: [] };
      }
    }

    function loadBrowserSdk(origin, fileName, globalName) {
      if (window[globalName]) return Promise.resolve();
      const src = `${origin}/browser-sdk/v3/${fileName}`;
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.addEventListener('load', () => {
          if (window[globalName]) {
            resolve();
            return;
          }
          reject(new Error(`${globalName} is unavailable after loading ${src}`));
        }, { once: true });
        script.addEventListener('error', () => {
          reject(new Error(`Failed to load ${src}`));
        }, { once: true });
        document.head.appendChild(script);
      });
    }

    async function ensureBrowserSdks(provider) {
      const normalizedProvider = provider === 'truewatch' ? 'truewatch' : 'guance';
      const origin = BROWSER_SDK_ORIGINS[normalizedProvider];
      await loadBrowserSdk(origin, 'dataflux-rum.js', 'DATAFLUX_RUM');
      try {
        await loadBrowserSdk(origin, 'dataflux-logs.js', 'DATAFLUX_LOGS');
      } catch (error) {
        console.warn('[Browser Logs] SDK loading failed', {
          provider: normalizedProvider,
          message: error.message,
        });
      }
      console.info('[RUM] browser SDK loaded', {
        provider: normalizedProvider,
        origin,
      });
    }

    function setCartQuantity(bookId, quantity, options = {}) {
      const book = I18N.bookById(bookId);
      const previousQuantity = Number(state.cart.get(book.id) || 0);
      const nextQuantity = Math.max(0, Math.min(99, Number(quantity) || 0));
      if (nextQuantity > 0) {
        state.cart.set(book.id, nextQuantity);
        if (options.select !== false) state.selectedCart.add(book.id);
      } else {
        state.cart.delete(book.id);
        state.selectedCart.delete(book.id);
      }
      if (previousQuantity !== nextQuantity && options.track !== false) {
        const text = localizedBook(book);
        addRumAction(nextQuantity > previousQuantity ? 'business_add_book_to_bag' : 'business_remove_book_from_bag', {
          product: text.title,
          book_id: book.id,
          sku: ORDER_BACKEND_SKU,
          cart_quantity: nextQuantity,
          trigger: options.trigger || 'store_action',
        });
      }
      renderProducts();
    }

    function addToCart(bookId, quantity = 1, options = {}) {
      const book = I18N.bookById(bookId);
      const next = Number(state.cart.get(book.id) || 0) + Math.max(1, Number(quantity) || 1);
      setCartQuantity(book.id, next, options);
      if (options.announce !== false) {
        const text = localizedBook(book);
        setPhoneResult('info', t('shopCartAddedTitle'), s('added', { title: text.title }));
      }
      if (options.navigate === true) navigateStorePage('cart', { trigger: options.trigger || 'buy_now' });
    }

    function removeFromCart(bookId, options = {}) {
      const book = I18N.bookById(bookId);
      const text = localizedBook(book);
      setCartQuantity(book.id, 0, { ...options, trigger: options.trigger || 'cart_remove' });
      if (options.announce !== false) setPhoneResult('info', t('shopCartRemovedTitle'), s('removed', { title: text.title }));
    }

    function clearSelectedCart() {
      [...state.selectedCart].forEach((bookId) => state.cart.delete(bookId));
      state.selectedCart.clear();
      renderProducts();
    }

    function setLanguage(language, options = {}) {
      state.language = I18N.setLanguage(language, { updateUrl: true });
      renderProducts();
      renderStorePage({ track: false });
      if (options.notify !== false) postToParent('shop-language-changed', { language: state.language });
      if (!state.activeClientFault) {
        hidePhoneResult();
      }
    }

    function activateClientFault(scenario) {
      state.activeClientFault = scenario;
      window.__activeFaultContext = clientFaultContext(scenario);
      const detail = scenario.id === 'frontend_sourcemap_error'
        ? t('shopStatusFrontendFaultSourceMap')
        : scenario.id === 'frontend_slow_resource'
          ? t('shopStatusFrontendFaultSlow')
          : t('shopStatusFrontendFaultClick');
      setPhoneResult('alert', t('shopStatusFrontendFault'), detail);
    }

    function clearClientFault() {
      state.activeClientFault = null;
      window.__activeFaultContext = null;
      hidePhoneResult();
    }

    function triggerClientFaultFromUserAction(actionName) {
      const scenario = state.activeClientFault;
      if (!scenario || !['frontend_click_error', 'frontend_slow_resource', 'frontend_sourcemap_error'].includes(scenario.id)) return false;
      const triggerId = newFaultTriggerId();
      const triggeredAt = Date.now();
      const rumCorrelation = currentRumCorrelation();
      window.__activeFaultContext = {
        ...clientFaultContext(scenario),
        fault_trigger_id: triggerId,
        fault_triggered_at: triggeredAt,
        rum_view_id: rumCorrelation.viewId,
        rum_session_id: rumCorrelation.sessionId,
      };
      addRumAction(`fault_${scenario.id}`, {
        trigger_action: actionName,
        ...window.__activeFaultContext,
      });
      postToParent('frontend-fault-triggered', {
        action: actionName,
        scenario,
        triggerId,
        triggeredAt,
        applicationId: rumCorrelation.applicationId,
        viewId: rumCorrelation.viewId,
        sessionId: rumCorrelation.sessionId,
      });
      log(t('shopLogFrontendFault', { action: actionName }), {
        status: 'error',
        context: {
          operation: `fault_${scenario.id}`,
          trigger_action: actionName,
          ...window.__activeFaultContext,
        },
      });
      if (scenario.id === 'frontend_slow_resource') {
        triggerFrontendSlowResourceFromUserAction(scenario, actionName, triggerId);
        return true;
      }
      triggerFrontendErrorAfterLoading(scenario, actionName);
      return true;
    }

    function triggerFrontendErrorAfterLoading(scenario, actionName) {
      setBusy(true);
      showPurchaseLoading(t('shopStatusSubmitting'), t('shopStatusSubmittingDetail'));
      window.setTimeout(() => {
        hidePurchaseLoading();
        setBusy(false);
        setPhoneResult('failed', t('shopStatusFrontendFaultFailed'), t('shopStatusFrontendFaultNoTrace'));
        if (scenario.id === 'frontend_sourcemap_error') {
          triggerSourcemapPurchaseNullPointer(actionName);
          return;
        }
        simulatePurchaseNullPointer();
      }, 700);
    }

    function simulatePurchaseNullPointer() {
      const brokenPurchaseState = null;
      return brokenPurchaseState.total.toFixed(2);
    }

    function triggerSourcemapPurchaseNullPointer(actionName) {
      if (!window.SelfhealSourcemapFault?.triggerCheckoutSourcemapFault) {
        throw new Error('SourceMap fault bundle is not loaded');
      }
      return window.SelfhealSourcemapFault.triggerCheckoutSourcemapFault(actionName);
    }

    async function triggerFrontendSlowResourceFromUserAction(scenario, actionName, triggerId) {
      const faultContext = window.__activeFaultContext || clientFaultContext(scenario);
      window.__activeFaultContext = faultContext;
      setBusy(true);
      showPurchaseLoading(t('shopStatusSlowLoading'), t('shopStatusSlowLoadingDetail'));
      const startedAt = performance.now();
      const { headers, bizRequestId, keyRequest } = buildHeaders('frontend_slow_resource');
      try {
        const { response, body } = await requestJson('/api/demo/slow-resource?delayMs=2600', {
          headers,
          rumContext: {
            operation: 'fault_frontend_slow_resource',
            keyRequest,
            bizChain: 'selfheal_checkout',
            bizRequestId,
            faultId: scenario.id,
            faultLayer: scenario.layer,
            faultKind: scenario.kind,
            faultTarget: scenario.target,
            faultTriggerId: triggerId,
            faultTriggeredAt: faultContext.fault_triggered_at,
          },
        });
        const elapsedMs = Math.round(performance.now() - startedAt);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const traceInfo = await logBackendTraceLogs({ businessRequestId: bizRequestId }, bizRequestId);
        postToParent('order-result', {
          ok: true,
          httpStatus: response.status,
          body: { ...body, businessRequestId: bizRequestId },
          bizRequestId,
          traceId: traceInfo.traceId || '',
          resource: '/api/demo/slow-resource',
          triggerId,
        });
        hidePurchaseLoading();
        setPhoneResult('success', t('shopStatusSlowDone'), t('shopStatusSlowDoneDetail', { elapsedMs, delayMs: body.delayMs || '-' }));
        log(t('shopLogSlowResource', { action: actionName, elapsedMs }), {
          status: 'warn',
          context: {
            operation: 'fault_frontend_slow_resource',
            trigger_action: actionName,
            key_request: keyRequest,
            biz_request_id: bizRequestId,
            http_status: response.status,
            duration_ms: elapsedMs,
            fault_id: scenario.id,
            fault_layer: scenario.layer,
            fault_kind: scenario.kind,
            fault_target: scenario.target,
            fault_trigger_id: triggerId,
            fault_triggered_at: faultContext.fault_triggered_at,
          },
        });
      } catch (error) {
        const traceInfo = await logBackendTraceLogs({ businessRequestId: bizRequestId }, bizRequestId);
        postToParent('order-result', {
          ok: false,
          httpStatus: 0,
          body: { error: error.message, businessRequestId: bizRequestId },
          bizRequestId,
          traceId: traceInfo.traceId || '',
          resource: '/api/demo/slow-resource',
          triggerId,
        });
        hidePurchaseLoading();
        setPhoneResult('failed', t('shopStatusSlowFailed'), error.message);
        log(t('shopLogSlowResourceFailed', { message: error.message }), {
          status: 'error',
          context: {
            operation: 'fault_frontend_slow_resource',
            trigger_action: actionName,
            key_request: keyRequest,
            biz_request_id: bizRequestId,
            fault_id: scenario.id,
            fault_layer: scenario.layer,
            fault_kind: scenario.kind,
            fault_target: scenario.target,
            fault_trigger_id: triggerId,
            fault_triggered_at: faultContext.fault_triggered_at,
          },
        });
      } finally {
        hidePurchaseLoading();
        setBusy(false);
      }
    }

    async function submitOrder(options = {}) {
      const notifyParent = options.notifyParent !== false;
      const manageBusy = options.manageBusy !== false;
      const updateStatus = options.updateStatus !== false;
      const actionName = options.actionName || 'buy_book_button';
      const cart = checkoutSnapshot();
      if (cart.totalCopies < 1 || cart.amountCent < 1) {
        return { ok: false, aborted: true, httpStatus: 0, body: { error: 'empty_cart' }, traceId: '' };
      }
      if (!options.skipClientFault && triggerClientFaultFromUserAction(actionName)) {
        return { ok: false, aborted: true, httpStatus: 0, body: { error: 'frontend_fault' }, traceId: '' };
      }

      const { headers, bizRequestId, keyRequest } = buildHeaders();
      const payload = {
        sku: ORDER_BACKEND_SKU,
        quantity: cart.totalCopies,
        amountCent: cart.amountCent,
      };

      if (manageBusy) setBusy(true);
      if (updateStatus) showPurchaseLoading(t('shopStatusSubmitting'), t('shopStatusSubmittingDetail'));
      addRumAction('business_submit_book_order', {
        product: cart.productLabel,
        sku: payload.sku,
        book_ids: cart.bookIds,
        book_titles: cart.titles,
        book_quantities: cart.quantities,
        cart_line_count: cart.lineCount,
        cart_total_copies: cart.totalCopies,
        cart_amount_cent: cart.amountCent,
      });

      try {
        const { response, body } = await requestJson('/api/orders', {
          method: 'POST',
          headers,
          rumContext: {
            operation: 'submit_book_order',
            keyRequest,
            bizChain: 'selfheal_checkout',
            bizRequestId,
            product: cart.productLabel,
            sku: payload.sku,
            bookIds: cart.bookIds,
            bookTitles: cart.titles,
            bookQuantities: cart.quantities,
            cartLineCount: cart.lineCount,
            cartTotalCopies: cart.totalCopies,
            cartAmountCent: cart.amountCent,
          },
          body: JSON.stringify(payload),
        });
        if (response.ok) {
          if (updateStatus) {
            hidePurchaseLoading();
            setPhoneResult('success', t('shopStatusSuccess'), t('shopStatusSuccessDetail', {
              orderId: body.orderId || '-',
              bizRequestId: shortId(body.businessRequestId || bizRequestId),
            }));
          }
        } else {
          if (updateStatus) {
            hidePurchaseLoading();
            setPhoneResult('failed', t('shopStatusFailed'), body.message || body.error || `HTTP ${response.status}`);
          }
        }

        const traceInfo = await logBackendTraceLogs(body, bizRequestId);
        const result = {
          ok: response.ok,
          httpStatus: response.status,
          body,
          bizRequestId,
          product: cart.productLabel,
          sku: payload.sku,
          bookIds: cart.bookIds,
          bookTitles: cart.titles,
          quantities: cart.quantities,
          quantity: cart.totalCopies,
          amountCent: cart.amountCent,
          traceId: traceInfo.traceId || '',
        };
        if (notifyParent) postToParent('order-result', result);
        log(t('shopLogSubmit', { status: response.status, body: shortJson(body) }), {
          context: {
            operation: 'submit_book_order',
            key_request: keyRequest,
            biz_chain: 'selfheal_checkout',
            biz_request_id: body.businessRequestId || bizRequestId,
            order_id: body.orderId,
            http_status: response.status,
            product: cart.productLabel,
            sku: payload.sku,
            book_ids: cart.bookIds,
            book_titles: cart.titles,
            book_quantities: cart.quantities,
            cart_line_count: cart.lineCount,
            cart_total_copies: cart.totalCopies,
            cart_amount_cent: cart.amountCent,
          },
        });
        return result;
      } catch (error) {
        if (updateStatus) {
          hidePurchaseLoading();
          setPhoneResult('failed', t('shopStatusFailed'), error.message);
        }
        const traceInfo = await logBackendTraceLogs({ businessRequestId: bizRequestId }, bizRequestId);
        const result = {
          ok: false,
          httpStatus: 0,
          body: { error: error.message },
          bizRequestId,
          product: cart.productLabel,
          sku: payload.sku,
          bookIds: cart.bookIds,
          bookTitles: cart.titles,
          quantities: cart.quantities,
          quantity: cart.totalCopies,
          amountCent: cart.amountCent,
          traceId: traceInfo.traceId || '',
        };
        if (notifyParent) postToParent('order-result', result);
        log(t('shopLogSubmitFailed', { message: error.message }), {
          status: 'error',
          context: {
            operation: 'submit_book_order',
            key_request: keyRequest,
            biz_chain: 'selfheal_checkout',
            biz_request_id: bizRequestId,
            product: cart.productLabel,
            sku: payload.sku,
            book_ids: cart.bookIds,
            book_titles: cart.titles,
            book_quantities: cart.quantities,
            cart_line_count: cart.lineCount,
            cart_total_copies: cart.totalCopies,
            cart_amount_cent: cart.amountCent,
          },
        });
        return result;
      } finally {
        if (updateStatus) hidePurchaseLoading();
        if (manageBusy) setBusy(false);
      }
    }

    async function runTraffic() {
      const cart = checkoutSnapshot();
      if (cart.totalCopies < 1 || cart.amountCent < 1) return;
      if (triggerClientFaultFromUserAction('traffic_buy_book_button')) return;
      log(t('shopLogTrafficStart'), { context: { operation: 'run_book_purchase_traffic', total: 5, book_ids: cart.bookIds, cart_total_copies: cart.totalCopies, cart_amount_cent: cart.amountCent } });
      setBusy(true);
      const results = [];
      try {
        for (let index = 0; index < 5; index += 1) {
          showPurchaseLoading(t('shopStatusBatchSubmitting', { current: index + 1, total: 5 }), t('shopStatusBatchSubmittingDetail'));
          const result = await submitOrder({
            notifyParent: false,
            manageBusy: false,
            updateStatus: false,
            skipClientFault: true,
            actionName: 'traffic_buy_book_button',
          });
          if (result) results.push(result);
          await new Promise((resolve) => setTimeout(resolve, 180));
        }
        const traceIds = [...new Set(results.map((item) => item.traceId).filter(Boolean))];
        const okCount = results.filter((item) => item.ok).length;
        hidePurchaseLoading();
        setPhoneResult(okCount === 5 ? 'success' : 'failed', t('shopStatusBatchSuccess', { count: okCount, total: 5 }), t('shopStatusBatchSuccessDetail', { traceCount: traceIds.length }));
        postToParent('order-result', {
          ok: okCount > 0,
          httpStatus: okCount === 5 ? 200 : 207,
          batch: true,
          body: {
            batch: true,
            total: 5,
            okCount,
            traceIds,
            orderIds: results.map((item) => item.body?.orderId).filter(Boolean),
          },
          product: cart.productLabel,
          sku: ORDER_BACKEND_SKU,
          bookIds: cart.bookIds,
          bookTitles: cart.titles,
          quantities: cart.quantities,
          quantity: cart.totalCopies,
          amountCent: cart.amountCent,
          traceIds,
        });
        log(t('shopLogTrafficDoneWithTraces', { count: okCount, traceCount: traceIds.length }), {
          context: {
            operation: 'run_book_purchase_traffic',
            total: 5,
            ok_count: okCount,
            trace_count: traceIds.length,
            book_ids: cart.bookIds,
            book_titles: cart.titles,
            book_quantities: cart.quantities,
            cart_total_copies: cart.totalCopies,
            cart_amount_cent: cart.amountCent,
          },
        });
      } finally {
        hidePurchaseLoading();
        setBusy(false);
      }
    }

    function handleParentMessage(event) {
      if (event.origin !== window.location.origin) return;
      const data = event.data || {};
      if (data.source !== 'mall-demo-parent') return;
      const payload = data.payload || {};
      if (data.type === 'set-language') {
        setLanguage(payload.language, { notify: false });
      } else if (data.type === 'set-demo-theme') {
        setDemoTheme(payload.theme, { persist: false, notify: false });
      } else if (data.type === 'set-preview-context') {
        setPreviewContext(payload.sceneId, payload.view);
      } else if (data.type === 'set-client-fault') {
        activateClientFault(payload.scenario);
      } else if (data.type === 'clear-client-fault') {
        clearClientFault();
      } else if (data.type === 'set-fault-hint') {
        setPhoneResult('alert', I18N.faultText(payload.scenario, 'title', state.language), t('shopStatusBackendFault'));
      }
    }

    window.addEventListener('message', handleParentMessage);
    window.addEventListener('popstate', (event) => {
      const previousPage = state.storePage;
      const url = new URL(window.location.href);
      const urlPage = url.searchParams.get('page');
      state.currentBookId = I18N.bookById(url.searchParams.get('book') || state.currentBookId).id;
      state.storePage = normalizeStorePage(event.state?.storePage || urlPage);
      state.storeHistoryIndex = Number.isFinite(Number(event.state?.storeIndex)) ? Number(event.state.storeIndex) : 0;
      const trigger = state.pendingHistoryTrigger || 'browser_history';
      state.pendingHistoryTrigger = null;
      renderStorePage({ previousPage, trigger });
    });
    els.submitBtn.addEventListener('click', async (event) => {
      if (event.detail > 0) event.currentTarget.blur();
      const result = await submitOrder();
      if (result?.ok) clearSelectedCart();
    });
    els.trafficBtn.addEventListener('click', runTraffic);
    els.storeSearch.addEventListener('input', (event) => {
      state.query = event.currentTarget.value;
      state.activeTopic = 'all';
      renderHomeProduct();
      if (state.storePage !== 'home') navigateStorePage('home', { trigger: 'search', historyMode: 'push' });
      addRumAction('business_search_bookstore', { query: state.query, result_count: document.querySelectorAll('.book-grid .book-card').length });
    });
    els.clearSearch.addEventListener('click', () => {
      state.query = '';
      els.storeSearch.value = '';
      renderHomeProduct();
      els.storeSearch.focus();
    });
    els.languageToggle.addEventListener('click', () => setLanguage(state.language === 'zh' ? 'en' : 'zh'));
    if (els.storeHome) {
      els.storeHome.addEventListener('click', (event) => {
        const topicTarget = event.target.closest('[data-topic]');
        if (topicTarget) {
          event.preventDefault();
          state.activeTopic = topicTarget.dataset.topic;
          renderHomeProduct();
          addRumAction('business_filter_bookstore', { topic: state.activeTopic });
          return;
        }
        const addTarget = event.target.closest('[data-add-book]');
        if (addTarget) {
          event.preventDefault();
          const bookId = addTarget.dataset.addBook;
          if (!isInCart(bookId)) addToCart(bookId, 1, { trigger: 'add_to_cart' });
          else navigateStorePage('cart', { trigger: 'view_existing_cart_item' });
          return;
        }
        const buyTarget = event.target.closest('[data-buy-book]');
        if (buyTarget) {
          event.preventDefault();
          addToCart(buyTarget.dataset.buyBook, state.detailQuantity, { navigate: true, trigger: 'buy_now' });
          return;
        }
        const removeTarget = event.target.closest('[data-remove-book]');
        if (removeTarget) {
          event.preventDefault();
          removeFromCart(removeTarget.dataset.removeBook);
          return;
        }
        const cartQuantityTarget = event.target.closest('[data-cart-quantity]');
        if (cartQuantityTarget) {
          event.preventDefault();
          const bookId = cartQuantityTarget.dataset.book;
          setCartQuantity(bookId, Number(state.cart.get(bookId) || 0) + Number(cartQuantityTarget.dataset.cartQuantity), { trigger: 'cart_quantity' });
          return;
        }
        const detailQuantityTarget = event.target.closest('[data-detail-quantity]');
        if (detailQuantityTarget) {
          event.preventDefault();
          state.detailQuantity = Math.max(1, Math.min(99, state.detailQuantity + Number(detailQuantityTarget.dataset.detailQuantity)));
          renderBookDetail();
          return;
        }
        const detailTabTarget = event.target.closest('[data-detail-tab]');
        if (detailTabTarget) {
          event.preventDefault();
          state.detailTab = detailTabTarget.dataset.detailTab;
          renderBookDetail();
          addRumAction('business_view_book_detail_tab', { book_id: state.currentBookId, tab: state.detailTab });
          return;
        }
        const removeSelectedTarget = event.target.closest('[data-remove-selected]');
        if (removeSelectedTarget) {
          event.preventDefault();
          const count = state.selectedCart.size;
          [...state.selectedCart].forEach((bookId) => state.cart.delete(bookId));
          state.selectedCart.clear();
          renderProducts();
          if (count) setPhoneResult('info', t('shopCartRemovedTitle'), s('removedSelected', { count }));
          return;
        }
        const bookTarget = event.target.closest('[data-book-id]');
        if (bookTarget) {
          event.preventDefault();
          openBookDetail(bookTarget.dataset.bookId, 'book_card');
          return;
        }
        const routeTarget = event.target.closest('[data-store-route]');
        if (!routeTarget) return;
        event.preventDefault();
        const trigger = routeTarget.dataset.routeTrigger
          || (routeTarget.closest('.store-nav') ? 'top_navigation' : 'page_action');
        navigateStorePage(routeTarget.dataset.storeRoute, { trigger });
      });
      els.storeHome.addEventListener('change', (event) => {
        if (event.target.id === 'sortControl') {
          state.sort = event.target.value;
          renderHomeProduct();
          addRumAction('business_sort_bookstore', { sort: state.sort });
          return;
        }
        const selectTarget = event.target.closest('[data-cart-select]');
        if (selectTarget) {
          const bookId = selectTarget.dataset.cartSelect;
          if (selectTarget.checked) state.selectedCart.add(bookId);
          else state.selectedCart.delete(bookId);
          renderCart();
          return;
        }
        if (event.target.matches('[data-cart-select-all]')) {
          if (event.target.checked) [...state.cart.keys()].forEach((bookId) => state.selectedCart.add(bookId));
          else state.selectedCart.clear();
          renderCart();
        }
      });
      els.storeHome.addEventListener('keydown', (event) => {
        const routeTarget = event.target.closest('[data-store-route][role="link"]');
        if (!routeTarget || (event.key !== 'Enter' && event.key !== ' ')) return;
        event.preventDefault();
        navigateStorePage(routeTarget.dataset.storeRoute, { trigger: 'keyboard_navigation' });
      });
      els.storeHome.addEventListener('touchstart', handleSwipeBackStart, { passive: true });
      els.storeHome.addEventListener('touchend', handleSwipeBackEnd, { passive: true });
      els.storeHome.addEventListener('touchcancel', () => {
        state.swipeBackStart = null;
      }, { passive: true });
    }
    if (els.shopThemePicker) {
      els.shopThemeTrigger.addEventListener('click', (event) => {
        event.stopPropagation();
        setThemeMenuOpen(els.shopThemePicker.dataset.open !== 'true');
      });
      els.shopThemePicker.addEventListener('click', (event) => {
        const button = event.target.closest('[data-demo-theme]');
        if (!button) return;
        event.stopPropagation();
        setDemoTheme(button.dataset.demoTheme);
        els.shopThemeTrigger.focus();
      });
      els.shopThemePicker.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        setThemeMenuOpen(false);
        els.shopThemeTrigger.focus();
      });
      document.addEventListener('click', (event) => {
        if (!event.target.closest('#shopThemePicker')) setThemeMenuOpen(false);
      });
    }
    initializeStoreHistory();
    applyPreviewObservabilityContext();
    renderDemoThemePicker();
    renderProducts();
    renderStorePage({ track: false });
    hidePhoneResult();
    initRum();
    postToParent('shop-ready', {
      language: state.language,
      theme: state.demoTheme,
      sceneId: state.businessScene,
      view: state.previewMode,
      page: state.storePage,
    });
  </script>
</body>
</html>
