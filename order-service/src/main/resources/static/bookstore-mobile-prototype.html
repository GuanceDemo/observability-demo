<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f6f3" />
  <title>可观测性书店 · 移动端原型</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --page: #f7f6f3;
      --surface: #ffffff;
      --surface-soft: #fbfaf8;
      --text: #221d1b;
      --muted: #746d68;
      --line: #e9e3dc;
      --accent: #f04b3f;
      --orange: #ff7a00;
      --magenta: #d730ff;
      --accent-soft: #fff1ed;
      --gradient: linear-gradient(135deg, #ff7a00 0%, #ff3856 56%, #d730ff 100%);
      --gradient-soft: linear-gradient(135deg, rgba(255, 122, 0, .12), rgba(255, 56, 86, .09) 54%, rgba(215, 48, 255, .08));
      --success: #13875d;
      --danger: #d92d20;
      --warning: #f0a51d;
      --phone-width: 393px;
      --phone-height: 852px;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html,
    body { min-width: 320px; min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 5%, rgba(255, 122, 0, .10), transparent 28%),
        radial-gradient(circle at 85% 92%, rgba(215, 48, 255, .08), transparent 27%),
        #eeeae6;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input { font: inherit; }

    button,
    a { -webkit-tap-highlight-color: transparent; }

    button { color: inherit; cursor: pointer; }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 2px solid rgba(240, 75, 63, .34);
      outline-offset: 2px;
    }

    [hidden] { display: none !important; }

    .phone {
      position: relative;
      width: var(--phone-width);
      height: var(--phone-height);
      overflow: hidden;
      border: 1px solid rgba(28, 24, 22, .18);
      border-radius: 32px;
      color: var(--text);
      background: var(--page);
      box-shadow: 0 30px 80px rgba(59, 42, 34, .18), 0 0 0 7px rgba(255, 255, 255, .5);
      isolation: isolate;
    }

    .statusbar {
      position: absolute;
      z-index: 50;
      inset: 0 0 auto;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 20px 0;
      color: #151312;
      background: rgba(255, 255, 255, .94);
      font-size: 11px;
      font-weight: 800;
      backdrop-filter: blur(16px);
    }

    .status-icons { display: flex; align-items: center; gap: 6px; }

    .signal-bars { height: 11px; display: flex; align-items: flex-end; gap: 1.5px; }
    .signal-bars i { width: 2px; border-radius: 1px; background: currentColor; }
    .signal-bars i:nth-child(1) { height: 4px; }
    .signal-bars i:nth-child(2) { height: 6px; }
    .signal-bars i:nth-child(3) { height: 8px; }
    .signal-bars i:nth-child(4) { height: 10px; }

    .wifi {
      width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      line-height: 0;
    }

    .wifi svg {
      width: 17px;
      height: 17px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.15;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .battery {
      position: relative;
      width: 17px;
      height: 8px;
      border: 1.3px solid currentColor;
      border-radius: 2px;
    }

    .battery::before { content: ""; position: absolute; inset: 1px; border-radius: 1px; background: currentColor; }
    .battery::after { content: ""; position: absolute; top: 2px; right: -3px; width: 2px; height: 4px; border-radius: 0 1px 1px 0; background: currentColor; }

    .app-viewport {
      position: absolute;
      inset: 30px 0 0;
      overflow: hidden;
      background: var(--page);
    }

    .screen-scroller {
      position: absolute;
      inset: 0 0 64px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      background: var(--page);
    }

    .screen-scroller::-webkit-scrollbar { display: none; }
    .phone.is-detail .screen-scroller { bottom: 68px; }
    .phone.is-cart .screen-scroller { bottom: 126px; }

    .app-header {
      position: sticky;
      z-index: 30;
      top: 0;
      min-height: 54px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border-bottom: 1px solid rgba(233, 227, 220, .88);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(18px);
    }

    .app-header.centered { grid-template-columns: 38px minmax(0, 1fr) auto; }
    .app-header.centered h1 { margin: 0; overflow: hidden; font-size: 15px; text-align: center; text-overflow: ellipsis; white-space: nowrap; }

    .brand {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      padding: 0;
      background: transparent;
      text-align: left;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: block;
    }

    .brand-mark svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 7px 12px rgba(240, 75, 63, .2)); }

    .brand-copy { min-width: 0; display: grid; gap: 1px; }
    .brand-copy strong { overflow: hidden; font-size: 14px; letter-spacing: -.02em; text-overflow: ellipsis; white-space: nowrap; }
    .brand-copy span { color: var(--muted); font-size: 8px; }

    .header-actions { display: flex; align-items: center; gap: 6px; }

    .round-button,
    .language-button,
    .back-button {
      position: relative;
      min-width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      padding: 0;
      color: #514b47;
      background: #fff;
    }

    .language-button { width: auto; min-width: 36px; border-radius: 999px; color: var(--accent); font-size: 9px; font-weight: 900; }
    .round-button svg,
    .back-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .header-cart-count,
    .nav-count {
      position: absolute;
      display: grid;
      place-items: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border: 2px solid #fff;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      font-size: 8px;
      line-height: 1;
    }

    .header-cart-count { top: -4px; right: -4px; }

    .search-wrap { padding: 9px 12px 0; background: #fff; }

    .search-form {
      position: relative;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface-soft);
    }

    .search-form svg { position: absolute; left: 11px; width: 16px; height: 16px; fill: none; stroke: #8b837d; stroke-width: 1.8; }
    .search-form input { width: 100%; height: 39px; border: 0; outline: 0; padding: 0 34px 0 34px; color: var(--text); background: transparent; font-size: 11px; }
    .search-form input::placeholder { color: #aaa39d; }
    .search-clear { position: absolute; right: 6px; width: 28px; height: 28px; border: 0; border-radius: 50%; color: #8d857e; background: transparent; font-size: 17px; }

    .home-content { display: grid; gap: 12px; padding: 10px 12px 22px; }

    .hero-card {
      position: relative;
      min-height: 191px;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) 104px;
      align-items: center;
      overflow: hidden;
      border: 1px solid #f0d4cc;
      border-radius: 17px;
      padding: 22px 9px 19px 19px;
      background:
        radial-gradient(circle at 89% 12%, rgba(215, 48, 255, .13), transparent 31%),
        var(--gradient-soft),
        #fff;
      box-shadow: 0 10px 28px rgba(61, 43, 35, .06);
    }

    .hero-card::after { content: ""; position: absolute; right: -38px; bottom: -65px; width: 160px; height: 160px; border: 1px solid rgba(215, 48, 255, .15); border-radius: 50%; }
    .hero-copy { position: relative; z-index: 2; min-width: 0; }
    .eyebrow { display: block; margin-bottom: 8px; color: var(--accent); font-size: 8px; font-weight: 900; letter-spacing: .14em; }
    .hero-copy h1 { margin: 0; font-size: 24px; line-height: 1.19; letter-spacing: -.055em; }
    .hero-copy p { margin: 9px 0 13px; color: var(--muted); font-size: 10px; line-height: 1.55; }

    .primary-button,
    .secondary-button {
      min-height: 36px;
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 10px;
      font-weight: 900;
    }

    .primary-button { color: #fff; background: var(--gradient); box-shadow: 0 8px 18px rgba(240, 75, 63, .2); }
    .secondary-button { border-color: var(--line); color: var(--text); background: #fff; }
    .hero-cover { position: relative; z-index: 2; width: 82px; justify-self: center; transform: rotate(4deg); filter: drop-shadow(0 10px 9px rgba(44, 30, 23, .16)); }

    .topic-scroll { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; scroll-snap-type: x proximity; }
    .topic-scroll::-webkit-scrollbar { display: none; }
    .topic-chip { min-width: max-content; min-height: 31px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; color: #625b55; background: #fff; font-size: 9px; font-weight: 800; scroll-snap-align: start; }
    .topic-chip.is-active { border-color: #f0aaa2; color: var(--accent); background: var(--accent-soft); }
    .topic-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gradient); }

    .section-heading { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .section-heading h2 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
    .section-heading span { color: var(--muted); font-size: 9px; }

    .book-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }

    .book-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 9px;
      background: #fff;
      box-shadow: 0 7px 19px rgba(55, 38, 31, .045);
    }

    .book-open { width: 100%; border: 0; padding: 0; background: transparent; text-align: left; }
    .book-card .cover { width: 96px; margin: 0 auto 9px; }
    .book-card h3 { min-height: 32px; margin: 0; overflow: hidden; font-size: 12px; line-height: 1.35; letter-spacing: -.015em; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .book-author { margin: 3px 0 0; overflow: hidden; color: var(--muted); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .book-tag { width: max-content; max-width: 100%; margin-top: 7px; overflow: hidden; border-radius: 5px; padding: 3px 5px; color: #9d4339; background: var(--accent-soft); font-size: 7px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .rating-row { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
    .stars { color: var(--warning); font-size: 8px; letter-spacing: -.06em; }
    .rating-row small { color: var(--muted); font-size: 7px; }
    .book-card-footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 5px; padding-top: 8px; }
    .price { color: var(--danger); font-size: 13px; font-weight: 900; }
    .add-button { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid #f1c8c3; border-radius: 9px; padding: 0; color: var(--accent); background: var(--accent-soft); }
    .add-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .benefit-card { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #ebddd6; border-radius: 13px; background: #fff; }
    .benefit { min-width: 0; display: grid; justify-items: center; gap: 5px; padding: 12px 4px; text-align: center; }
    .benefit + .benefit { border-left: 1px solid #efe9e4; }
    .benefit-icon { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 50%; color: var(--accent); background: var(--accent-soft); }
    .benefit-icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .benefit strong { font-size: 8px; }
    .benefit span { overflow: hidden; color: var(--muted); font-size: 7px; text-overflow: ellipsis; white-space: nowrap; }

    .cover {
      position: relative;
      aspect-ratio: 2 / 2.82;
      overflow: hidden;
      border: 1px solid rgba(55, 38, 31, .13);
      border-radius: 4px 7px 7px 4px;
      background: #eee;
      box-shadow: 0 8px 14px rgba(39, 25, 20, .14);
    }

    .cover::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: linear-gradient(90deg, rgba(0, 0, 0, .22), rgba(255, 255, 255, .15)); mix-blend-mode: multiply; opacity: .55; }
    .cover img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .css-cover { display: flex; align-items: stretch; padding: 7px; color: var(--cover-ink); background: var(--cover-bg); }
    .css-cover::before { content: ""; position: absolute; inset: 0; background: var(--cover-art); opacity: .85; }
    .css-cover-inner { position: relative; z-index: 2; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between; border: 1px solid color-mix(in srgb, var(--cover-ink) 24%, transparent); padding: 11% 7%; text-align: center; }
    .cover-kicker { font-size: 6px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .cover-title { white-space: pre-line; font-family: Georgia, "Songti SC", serif; font-size: 12px; font-weight: 900; line-height: 1.22; }
    .cover-author { font-size: 5px; line-height: 1.2; }

    .page-shell { min-height: 100%; }
    .page-body { display: grid; gap: 12px; padding: 12px 12px 24px; }

    .page-intro {
      position: relative;
      overflow: hidden;
      border: 1px solid #f1d2c9;
      border-radius: 16px;
      padding: 24px 19px;
      background: var(--gradient-soft), #fff;
    }

    .page-intro::after { content: ""; position: absolute; right: -28px; top: -38px; width: 130px; height: 130px; border: 1px solid rgba(215, 48, 255, .14); border-radius: 50%; }
    .page-intro h2 { position: relative; z-index: 2; margin: 0; font-size: 22px; line-height: 1.23; letter-spacing: -.05em; }
    .page-intro p { position: relative; z-index: 2; margin: 9px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; }

    .path-list { display: grid; gap: 10px; }
    .stage-card { border: 1px solid var(--line); border-radius: 15px; padding: 13px; background: #fff; }
    .stage-head { display: grid; grid-template-columns: 47px minmax(0, 1fr); gap: 11px; align-items: center; }
    .stage-number { width: 47px; height: 47px; display: grid; place-items: center; border-radius: 14px; color: #fff; background: var(--gradient); font-size: 10px; font-weight: 900; }
    .stage-copy { min-width: 0; }
    .stage-copy h3 { margin: 0; font-size: 13px; }
    .stage-copy p { margin: 5px 0 0; color: var(--muted); font-size: 9px; line-height: 1.52; }
    .stage-books { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 11px; }
    .stage-book { min-width: 0; display: grid; grid-template-columns: 38px minmax(0, 1fr); align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 10px; padding: 7px; background: var(--surface-soft); text-align: left; }
    .stage-book .cover { width: 38px; box-shadow: 0 4px 8px rgba(39, 25, 20, .12); }
    .stage-book-copy { min-width: 0; }
    .stage-book strong { display: -webkit-box; overflow: hidden; font-size: 8px; line-height: 1.35; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .stage-book span { display: block; margin-top: 3px; overflow: hidden; color: var(--muted); font-size: 6.5px; text-overflow: ellipsis; white-space: nowrap; }

    .detail-hero { padding: 17px 15px 15px; background: linear-gradient(180deg, #fff, #fbf4f1); }
    .detail-cover-wrap { min-height: 225px; display: grid; place-items: center; }
    .detail-cover-wrap .cover { width: 136px; box-shadow: 0 17px 26px rgba(42, 28, 23, .2); }
    .detail-copy { padding-top: 16px; }
    .detail-copy h2 { margin: 0; font-size: 20px; line-height: 1.25; letter-spacing: -.035em; }
    .english-title { margin: 5px 0 0; color: var(--muted); font-size: 9px; }
    .author-line { margin: 9px 0 0; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .tag { border-radius: 5px; padding: 4px 6px; color: #97443a; background: var(--accent-soft); font-size: 7px; font-weight: 800; }
    .detail-rating { display: flex; align-items: center; gap: 7px; margin-top: 11px; }
    .detail-rating .stars { font-size: 13px; }
    .detail-rating span { color: var(--muted); font-size: 8px; }
    .detail-price { display: flex; align-items: baseline; gap: 7px; margin-top: 13px; }
    .detail-price strong { color: var(--danger); font-size: 23px; }
    .detail-price span { color: #aaa19b; font-size: 8px; text-decoration: line-through; }

    .service-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #eee7e1; margin-top: 15px; padding-top: 12px; }
    .service-item { min-width: 0; display: flex; align-items: center; justify-content: center; gap: 4px; color: #665e59; font-size: 7px; }
    .service-item svg { width: 13px; height: 13px; flex: 0 0 auto; fill: none; stroke: var(--accent); stroke-width: 1.8; }

    .detail-card { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff; }
    .detail-tabs { position: sticky; top: 54px; z-index: 20; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .96); backdrop-filter: blur(14px); }
    .tab-button { position: relative; min-height: 44px; border: 0; padding: 8px 5px; color: var(--muted); background: transparent; font-size: 10px; font-weight: 800; }
    .tab-button.is-active { color: var(--accent); }
    .tab-button.is-active::after { content: ""; position: absolute; right: 22%; bottom: 0; left: 22%; height: 2px; border-radius: 3px; background: var(--gradient); }
    .detail-tab-content { padding: 17px 15px 20px; }
    .detail-tab-content h3 { margin: 0 0 10px; font-size: 14px; }
    .detail-tab-content > p { margin: 0; color: #5f5853; font-size: 10px; line-height: 1.75; }
    .learn-list,
    .chapter-list,
    .audience-list { display: grid; gap: 9px; margin-top: 15px; }
    .learn-item,
    .chapter-item,
    .audience-item { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 9px; border-radius: 10px; padding: 10px; background: var(--surface-soft); }
    .learn-index,
    .chapter-index,
    .audience-index { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: #fff; background: var(--gradient); font-size: 8px; font-weight: 900; }
    .learn-item strong,
    .chapter-item strong,
    .audience-item strong { display: block; font-size: 10px; }
    .learn-item p,
    .chapter-item p,
    .audience-item p { margin: 4px 0 0; color: var(--muted); font-size: 8px; line-height: 1.5; }

    .spec-card { border-top: 1px solid var(--line); margin-top: 12px; padding: 16px 15px 24px; background: #fff; }
    .spec-card h3 { margin: 0 0 12px; font-size: 14px; }
    .spec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .spec { border-radius: 9px; padding: 10px; background: var(--surface-soft); }
    .spec span { display: block; color: var(--muted); font-size: 7px; }
    .spec strong { display: block; margin-top: 4px; overflow: hidden; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }

    .detail-buy-bar,
    .cart-checkout-bar,
    .bottom-nav {
      position: absolute;
      z-index: 45;
      right: 0;
      bottom: 0;
      left: 0;
      background: rgba(255, 255, 255, .97);
      backdrop-filter: blur(18px);
    }

    .detail-buy-bar { height: 68px; display: grid; grid-template-columns: 42px 84px minmax(0, 1fr); align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 8px 12px; }
    .favorite-button { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 10px; color: #716963; background: var(--surface-soft); }
    .favorite-button.is-active { color: var(--accent); background: var(--accent-soft); }
    .favorite-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }

    .quantity-control { height: 36px; display: grid; grid-template-columns: 28px minmax(26px, 1fr) 28px; align-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    .quantity-control button { height: 100%; border: 0; padding: 0; color: #6b635e; background: transparent; font-size: 16px; }
    .quantity-control span { text-align: center; font-size: 10px; }
    .detail-add-button { height: 44px; border: 0; border-radius: 10px; color: #fff; background: var(--gradient); font-size: 11px; font-weight: 900; }

    .cart-page { min-height: 100%; background: var(--page); }
    .cart-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 13px; border-bottom: 1px solid var(--line); background: #fff; }
    .check-label { min-width: 0; display: inline-flex; align-items: center; gap: 7px; font-size: 10px; }
    .check-label input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }

        <section class="spec-card"><h3>${escapeHtml(t('specs'))}</h3><div class="spec-grid">
          <div class="spec"><span>${escapeHtml(t('published'))}</span><strong>${escapeHtml(text.published)}</strong></div>
          <div class="spec"><span>${escapeHtml(t('pages'))}</span><strong>${escapeHtml(text.pages)}</strong></div>
          <div class="spec"><span>${escapeHtml(t('level'))}</span><strong>${escapeHtml(text.level)}</strong></div>
          <div class="spec"><span>${escapeHtml(t('publisher'))}</span><strong>${escapeHtml(text.publisher)}</strong></div>
        </div></section>
      </div>`;
    }

    function renderDetailBar() {
      const active = state.favorites.has(state.bookId);
      return `<div class="detail-buy-bar">
        <button class="favorite-button ${active ? 'is-active' : ''}" type="button" data-action="favorite" aria-label="${escapeHtml(t(active ? 'unfavorite' : 'favorite'))}"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"></path></svg></button>
        <div class="quantity-control"><button type="button" data-detail-qty="-1" aria-label="Decrease">−</button><span>${state.detailQuantity}</span><button type="button" data-detail-qty="1" aria-label="Increase">＋</button></div>
        <button class="detail-add-button" type="button" data-action="add-detail">${escapeHtml(t('addCart'))}</button>
      </div>`;
    }

    function selectedStats() {
      let count = 0; let total = 0;
      state.selected.forEach((id) => {
        const quantity = state.cart.get(id) || 0;
        const book = sourceBook(id);
        count += quantity;
        total += quantity * book.price;
      });
      return {count, total};
    }

    function renderCartItem(id, quantity) {
      const book = sourceBook(id); const text = bookText(book);
      return `<article class="cart-item">
        <input type="checkbox" data-select="${id}" aria-label="${escapeHtml(text.title)}" ${state.selected.has(id) ? 'checked' : ''} />
        <button class="book-open" type="button" data-book="${id}">${renderCover(book)}</button>
        <div class="cart-item-copy"><h3>${escapeHtml(text.title)}</h3><span class="cart-edition">${escapeHtml(t('unitEdition'))}</span><strong class="cart-price">${money(book.price)}</strong>
          <div class="cart-item-actions"><div class="quantity-control"><button type="button" data-cart-qty="-1" data-id="${id}">−</button><span>${quantity}</span><button type="button" data-cart-qty="1" data-id="${id}">＋</button></div><button class="remove-button" type="button" data-remove="${id}" aria-label="${escapeHtml(t('remove'))}">${icons.trash}</button></div>
        </div>
      </article>`;
    }

    function renderCart() {
      const entries = [...state.cart.entries()];
      const allSelected = entries.length > 0 && entries.every(([id]) => state.selected.has(id));
      const stats = selectedStats();
      elements.scroller.innerHTML = `<div class="cart-page">
        ${pageHeader(t('cart'))}
        ${entries.length ? `<div class="cart-toolbar"><label class="check-label"><input type="checkbox" data-action="select-all" ${allSelected ? 'checked' : ''} />${escapeHtml(t('selected', {count: stats.count}))}</label><button type="button" data-action="remove-selected">${escapeHtml(t('manage'))}</button></div>
          <div class="cart-list">${entries.map(([id, quantity]) => renderCartItem(id, quantity)).join('')}</div>
          <div class="shipping-note"><svg viewBox="0 0 24 24"><path d="m12 3 7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z"></path><path d="m9 12 2 2 4-5"></path></svg><span>${escapeHtml(t('promo'))}</span></div>
          <section class="cart-summary"><h2>${escapeHtml(t('cartSummary'))}</h2><div class="summary-line"><span>${escapeHtml(t('subtotal'))}</span><strong>${money(stats.total)}</strong></div><div class="summary-line"><span>${escapeHtml(t('shipping'))}</span><strong>${escapeHtml(t('free'))}</strong></div><div class="summary-line total"><span>${escapeHtml(t('total'))}</span><strong>${money(stats.total)}</strong></div></section>`
        : `<div class="cart-empty"><div><span class="empty-mark">${icons.cart}</span><h2>${escapeHtml(t('cartEmpty'))}</h2><p>${escapeHtml(t('cartEmptyText'))}</p><button class="primary-button" type="button" data-route="home">${escapeHtml(t('browse'))}</button></div></div>`}
      </div>`;
    }

    function renderCartBar() {
      const entries = [...state.cart.entries()];
      if (!entries.length) return '';
      const allSelected = entries.every(([id]) => state.selected.has(id));
      const stats = selectedStats();
      return `<div class="cart-checkout-bar"><label class="check-label"><input type="checkbox" data-action="select-all" ${allSelected ? 'checked' : ''} />${escapeHtml(t('all'))}</label><div class="checkout-total"><span>${escapeHtml(t('total'))}</span><strong>${money(stats.total)}</strong></div><button class="checkout-button" type="button" data-action="checkout" ${stats.count ? '' : 'disabled'}>${escapeHtml(t('checkout', {count: stats.count}))}</button></div>`;
    }

    function renderBottomNav() {
      if (state.route === 'detail') { elements.bottomNav.hidden = true; elements.bottomNav.innerHTML = ''; return; }
      elements.bottomNav.hidden = false;
      const count = cartCount();
      const items = [['home', icons.home], ['path', icons.path], ['cart', icons.cart]];
      elements.bottomNav.setAttribute('aria-label', state.language === 'zh' ? '移动端主导航' : 'Mobile navigation');
      elements.bottomNav.innerHTML = items.map(([route, icon]) => `<button class="nav-button ${state.route === route ? 'is-active' : ''}" type="button" data-route="${route}"><span class="nav-icon">${icon}${route === 'cart' && count ? `<strong class="nav-count">${count}</strong>` : ''}</span><span class="nav-label">${escapeHtml(t(route))}</span></button>`).join('');
    }

    function parseRoute() {
      const raw = location.hash.replace(/^#\/?/, '');
      if (raw.startsWith('detail/')) {
        const id = raw.slice(7);
        if (BOOKS.some((book) => book.id === id)) state.bookId = id;
        state.route = 'detail';
      } else if (['home', 'path', 'cart'].includes(raw)) {
        state.route = raw;
      } else {
        state.route = 'home';
      }
    }

    function render(options = {}) {
      document.documentElement.lang = state.language === 'zh' ? 'zh-CN' : 'en';
      document.title = t('documentTitle');
      elements.phone.classList.toggle('is-detail', state.route === 'detail');
      elements.phone.classList.toggle('is-cart', state.route === 'cart');
      if (state.route === 'home') renderHome();
      if (state.route === 'path') renderPath();
      if (state.route === 'detail') renderDetail();
      if (state.route === 'cart') renderCart();
      elements.floatingBar.innerHTML = state.route === 'detail' ? renderDetailBar() : state.route === 'cart' ? renderCartBar() : '';
      renderBottomNav();
      if (!options.keepScroll) elements.scroller.scrollTop = 0;
    }

    function navigate(route, bookId) {
      if (route === 'detail' && bookId) state.bookId = bookId;
      const hash = route === 'detail' ? `#detail/${state.bookId}` : `#${route}`;
      if (location.hash === hash) { state.route = route; render(); } else { location.hash = hash; }
    }

    function showToast(message) {
      if (state.toastTimer) clearTimeout(state.toastTimer);
      elements.toastMessage.textContent = message;
      elements.toast.classList.add('is-visible');
      state.toastTimer = setTimeout(() => elements.toast.classList.remove('is-visible'), 2600);
    }

    function addToCart(id, quantity = 1) {
      const book = sourceBook(id);
      state.cart.set(id, (state.cart.get(id) || 0) + quantity);
      state.selected.add(id);
      showToast(t('added', {title: bookText(book).title}));
      render({keepScroll: true});
    }

    function removeFromCart(id) {
      const title = bookText(sourceBook(id)).title;
      state.cart.delete(id);
      state.selected.delete(id);
      showToast(t('removed', {title}));
      render({keepScroll: true});
    }

    async function shareBook() {
      const shareUrl = `${location.href.split('#')[0]}#detail/${state.bookId}`;
      try {
        if (navigator.share) {
          await navigator.share({title: bookText(sourceBook(state.bookId)).title, url: shareUrl});
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(shareUrl);
        }
      } catch (_) {
        return;
      }
      showToast(t('shareDone'));
    }

    document.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.route) return navigate(button.dataset.route);
      if (button.dataset.book) return navigate('detail', button.dataset.book);
      if (button.dataset.add) return addToCart(button.dataset.add);
      if (button.dataset.topic) { state.topic = button.dataset.topic; return render({keepScroll: true}); }
      if (button.dataset.tab) { state.detailTab = button.dataset.tab; return render({keepScroll: true}); }
      if (button.dataset.remove) return removeFromCart(button.dataset.remove);
      if (button.dataset.cartQty) {
        const id = button.dataset.id;
        const next = (state.cart.get(id) || 1) + Number(button.dataset.cartQty);
        if (next <= 0) return removeFromCart(id);
        state.cart.set(id, Math.min(next, 9));
        return render({keepScroll: true});
      }
      if (button.dataset.detailQty) {
        state.detailQuantity = Math.min(9, Math.max(1, state.detailQuantity + Number(button.dataset.detailQty)));
        return render({keepScroll: true});
      }
      const action = button.dataset.action;
      if (action === 'language') { state.language = state.language === 'zh' ? 'en' : 'zh'; return render({keepScroll: true}); }
      if (action === 'back') return history.length > 1 ? history.back() : navigate('home');
      if (action === 'share') return shareBook();
      if (action === 'favorite') {
        if (state.favorites.has(state.bookId)) state.favorites.delete(state.bookId); else state.favorites.add(state.bookId);
        return render({keepScroll: true});
      }
      if (action === 'add-detail') return addToCart(state.bookId, state.detailQuantity);
      if (action === 'clear-search') { state.query = ''; state.topic = 'all'; return render({keepScroll: true}); }
      if (action === 'remove-selected') {
        const count = state.selected.size;
        [...state.selected].forEach((id) => state.cart.delete(id));
        state.selected.clear();
        showToast(t('removedSelected', {count}));
        return render({keepScroll: true});
      }
      if (action === 'checkout') {
        const stats = selectedStats();
        return showToast(t('checkoutToast', {count: stats.count, total: money(stats.total)}));
      }
    });

    document.addEventListener('change', (event) => {
      const input = event.target;
      if (input.matches('[data-select]')) {
        if (input.checked) state.selected.add(input.dataset.select); else state.selected.delete(input.dataset.select);
        render({keepScroll: true});
      }
      if (input.matches('[data-action="select-all"]')) {
        state.selected.clear();
        if (input.checked) state.cart.forEach((_, id) => state.selected.add(id));
        render({keepScroll: true});
      }
    });

    document.addEventListener('submit', (event) => {
      if (event.target.id !== 'searchForm') return;
      event.preventDefault();
      state.query = document.getElementById('searchInput').value.trim();
      state.topic = 'all';
      render({keepScroll: true});
    });

    elements.scroller.addEventListener('touchstart', (event) => {
      if (event.touches.length !== 1 || state.route === 'home') return;
      const touch = event.touches[0];
      state.touchStart = {x: touch.clientX, y: touch.clientY, time: Date.now()};
    }, {passive: true});

    elements.scroller.addEventListener('touchend', (event) => {
      if (!state.touchStart || event.changedTouches.length !== 1) return;
      const touch = event.changedTouches[0];
      const deltaX = touch.clientX - state.touchStart.x;
      const deltaY = Math.abs(touch.clientY - state.touchStart.y);
      const duration = Date.now() - state.touchStart.time;
      state.touchStart = null;
      if (deltaX > 78 && deltaY < 46 && duration < 700) navigate('home');
    }, {passive: true});

    window.addEventListener('hashchange', () => { parseRoute(); render(); });
    parseRoute();
    render();
  </script>
</body>
</html>
