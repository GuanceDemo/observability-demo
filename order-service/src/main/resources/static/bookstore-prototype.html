<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f6f3" />
  <title>可观测性书店 · 商城 UI 原型</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --demo-page: #f7f6f3;
      --demo-surface: #ffffff;
      --demo-surface-soft: #fbfaf8;
      --demo-text: #1c1a18;
      --demo-title: #231c1b;
      --demo-muted: #706b64;
      --demo-line: #e6e1da;
      --demo-accent: #f04b3f;
      --demo-orange: #ff7a00;
      --demo-magenta: #d730ff;
      --demo-accent-soft: #fff1ed;
      --demo-gradient: linear-gradient(135deg, #ff7a00 0%, #ff3856 56%, #d730ff 100%);
      --demo-gradient-soft: linear-gradient(135deg, rgba(255, 122, 0, 0.11), rgba(255, 56, 86, 0.09) 56%, rgba(215, 48, 255, 0.08));
      --demo-success: #149d68;
      --demo-warning: #f2a321;
      --demo-danger: #d92d20;
      --demo-shadow: 0 18px 48px rgba(55, 38, 31, 0.08);
      --demo-shadow-soft: 0 9px 28px rgba(55, 38, 31, 0.055);
      --demo-radius-lg: 20px;
      --demo-radius-md: 14px;
      --demo-radius-sm: 10px;
      --demo-content: 1500px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--demo-text);
      background:
        radial-gradient(circle at 7% -4%, rgba(255, 122, 0, 0.08), transparent 24%),
        radial-gradient(circle at 94% 2%, rgba(215, 48, 255, 0.06), transparent 20%),
        var(--demo-page);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body.is-locked {
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(240, 75, 63, 0.24);
      outline-offset: 2px;
    }

    [hidden] {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .icon {
      width: 20px;
      height: 20px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid rgba(230, 225, 218, 0.94);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 4px 18px rgba(55, 38, 31, 0.035);
      backdrop-filter: blur(18px);
    }

    .header-inner {
      width: min(var(--demo-content), calc(100% - 48px));
      min-height: 72px;
      display: grid;
      grid-template-columns: auto minmax(350px, 1fr) minmax(290px, 420px) auto;
      align-items: center;
      gap: clamp(18px, 2.2vw, 34px);
      margin: 0 auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      padding: 0;
      background: transparent;
      text-align: left;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      display: block;
    }

    .brand-mark svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 8px 14px rgba(240, 75, 63, 0.2));
    }

    .brand-copy {
      display: grid;
      gap: 2px;
      white-space: nowrap;
    }

    .brand-copy strong {
      color: var(--demo-title);
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .brand-copy span {
      color: var(--demo-muted);
      font-size: 10px;
    }

    .desktop-nav {
      height: 72px;
      display: flex;
      align-items: stretch;
      gap: 6px;
    }

    .nav-button {
      position: relative;
      min-width: 58px;
      border: 0;
      padding: 0 12px;
      color: #4b4641;
      background: transparent;
      font-size: 13px;
      font-weight: 700;
    }

    .nav-button::after {
      content: "";
      position: absolute;
      right: 15px;
      bottom: 0;
      left: 15px;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--demo-gradient);
      opacity: 0;
      transform: scaleX(0.5);
      transition: 160ms ease;
    }

    .nav-button:hover,
    .nav-button.is-active {
      color: var(--demo-accent);
    }

    .nav-button.is-active::after {
      opacity: 1;
      transform: scaleX(1);
    }

    .search-form {
      position: relative;
      min-width: 0;
    }

    .search-form > .icon {
      position: absolute;
      top: 50%;
      left: 15px;
      color: #918a84;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .search-input {
      width: 100%;
      height: 42px;
      border: 1px solid #dfd9d2;
      border-radius: 11px;
      padding: 0 42px 0 44px;
      color: var(--demo-text);
      background: #fcfbfa;
      transition: 160ms ease;
    }

    .search-input::placeholder {
      color: #a29b95;
    }

    .search-input:hover,
    .search-input:focus {
      border-color: #f2afa8;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(240, 75, 63, 0.07);
      outline: 0;
    }

    .search-clear {
      position: absolute;
      top: 50%;
      right: 9px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #8b837d;
      background: transparent;
      transform: translateY(-50%);
    }

    .search-clear:hover {
      color: var(--demo-text);
      background: #f2efec;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .language-switch {
      min-width: 42px;
      min-height: 30px;
      border: 1px solid var(--demo-line);
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--demo-accent);
      background: #fff;
      font-size: 10px;
      font-weight: 900;
    }

    .language-switch:hover {
      border-color: #efb9b3;
      background: var(--demo-accent-soft);
    }

    .header-action {
      position: relative;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 0;
      padding: 7px 5px;
      color: #3c3733;
      background: transparent;
      font-size: 13px;
      white-space: nowrap;
    }

    .header-action:hover {
      color: var(--demo-accent);
    }

    .header-action.is-active {
      border-radius: 10px;
      color: var(--demo-accent);
      background: var(--demo-accent-soft);
    }

    .cart-count {
      position: absolute;
      top: 0;
      left: 17px;
      min-width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      padding: 0 5px;
      border: 2px solid #fff;
      border-radius: 999px;
      color: #fff;
      background: var(--demo-gradient);
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
    }

    .mobile-search {
      display: none;
    }

    .app-page {
      width: min(var(--demo-content), calc(100% - 48px));
      margin: 22px auto 56px;
    }

    .home-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
      gap: 18px;
    }

    .home-main {
      min-width: 0;
      display: grid;
      gap: 16px;
    }

    .store-hero {
      position: relative;
      min-height: 310px;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
      overflow: hidden;
      border: 1px solid rgba(240, 75, 63, 0.12);
      border-radius: var(--demo-radius-lg);
      background:
        radial-gradient(circle at 86% 15%, rgba(215, 48, 255, 0.14), transparent 24%),
        radial-gradient(circle at 58% 100%, rgba(255, 122, 0, 0.13), transparent 28%),
        linear-gradient(135deg, #fff7ef, #fff3f4 56%, #fcf3ff);
      box-shadow: var(--demo-shadow-soft);
      isolation: isolate;
    }

    .store-hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 40px;
      right: 26%;
      width: 260px;
      height: 180px;
      border-top: 1px solid rgba(240, 75, 63, 0.18);
      border-right: 1px solid rgba(215, 48, 255, 0.14);
      border-radius: 50%;
      transform: rotate(-12deg);
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 42px 28px 48px clamp(34px, 5vw, 70px);
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 10px;
      color: var(--demo-accent);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .hero-kicker::before {
      content: "";
      width: 22px;
      height: 3px;
      border-radius: 999px;
      background: var(--demo-gradient);
    }

    .hero-copy h1 {
      max-width: 670px;
      margin: 0;
      color: var(--demo-title);
      font-size: clamp(34px, 3.3vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .hero-copy p {
      max-width: 620px;
      margin: 13px 0 0;
      color: #665c57;
      font-size: 15px;
      line-height: 1.75;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 15px;
      margin-top: 15px;
      color: #756b65;
      font-size: 11px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 21px;
    }

    .primary-button,
    .secondary-button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 10px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 800;
      transition: 150ms ease;
    }

    .primary-button {
      border: 1px solid transparent;
      color: #fff;
      background: var(--demo-gradient);
      box-shadow: 0 10px 24px rgba(240, 75, 63, 0.2);
    }

    .primary-button:hover {
      filter: saturate(1.08) brightness(0.98);
      transform: translateY(-1px);
    }

    .secondary-button {
      border: 1px solid #f3beb8;
      color: var(--demo-accent);
      background: rgba(255, 255, 255, 0.78);
    }

    .secondary-button:hover {
      border-color: var(--demo-accent);
      background: #fff;
    }

    .hero-visual {
      position: relative;
      min-width: 0;
      display: grid;
      place-items: center;
      padding: 25px 30px 20px 6px;
    }

    .hero-visual::before {
      content: "";
      position: absolute;
      right: 7%;
      bottom: 17px;
      left: 6%;
      height: 42px;
      border-radius: 50%;
      background: rgba(84, 52, 42, 0.16);
      filter: blur(18px);
    }

    .hero-book {
      position: relative;
      z-index: 2;
      width: 172px;
      overflow: hidden;
      border: 1px solid rgba(117, 94, 81, 0.16);
      border-radius: 4px 9px 9px 4px;
      background: #fff;
      box-shadow:
        -8px 0 0 rgba(236, 232, 227, 0.9),
        0 22px 38px rgba(70, 44, 36, 0.22);
      transform: rotate(2deg);
    }

    .hero-book img {
      width: 100%;
      display: block;
    }

    .signal-chip {
      position: absolute;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      padding: 8px 11px;
      color: #4f4540;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 10px 24px rgba(75, 47, 39, 0.11);
      font-size: 10px;
      font-weight: 800;
      backdrop-filter: blur(10px);
    }

    .signal-chip i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--chip-color);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--chip-color) 16%, transparent);
    }

    .signal-chip.metrics {
      top: 50px;
      left: 3%;
      --chip-color: #ff7a00;
    }

    .signal-chip.traces {
      top: 46%;
      right: 2%;
      --chip-color: #d730ff;
    }

    .signal-chip.rum {
      bottom: 43px;
      left: 2%;
      --chip-color: #f04b3f;
    }

    .topic-strip {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
    }

    .topic-button {
      min-width: 0;
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--demo-line);
      border-radius: 13px;
      padding: 11px 12px;
      color: var(--demo-text);
      background: var(--demo-surface);
      box-shadow: 0 5px 18px rgba(55, 38, 31, 0.035);
      text-align: left;
      transition: 160ms ease;
    }

    .topic-button:hover,
    .topic-button.is-active {
      border-color: #f1b7b1;
      color: var(--demo-accent);
      background: #fffaf9;
      box-shadow: 0 9px 24px rgba(240, 75, 63, 0.08);
      transform: translateY(-1px);
    }

    .topic-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--demo-accent);
      background: var(--demo-accent-soft);
    }

    .topic-icon .icon {
      width: 19px;
      height: 19px;
    }

    .topic-copy {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .topic-copy strong,
    .topic-copy span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topic-copy strong {
      font-size: 12px;
    }

    .topic-copy span {
      color: var(--demo-muted);
      font-size: 9px;
    }

    .shelf {
      border: 1px solid var(--demo-line);
      border-radius: var(--demo-radius-lg);
      padding: 18px 16px 20px;
      background: var(--demo-surface);
      box-shadow: var(--demo-shadow-soft);
    }

    .section-heading {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 0 2px 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .section-title-mark {
      width: 10px;
      height: 24px;
      border-radius: 999px;
      background: var(--demo-gradient);
    }

    .section-title h2 {
      margin: 0;
      color: var(--demo-title);
      font-size: 17px;
    }

    .result-count {
      color: var(--demo-muted);
      font-size: 11px;
    }

    .sort-control {
      height: 34px;
      border: 1px solid var(--demo-line);
      border-radius: 9px;
      padding: 0 28px 0 10px;
      color: #605952;
      background: #fff;
      font-size: 11px;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .book-card {
      min-width: 0;
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 13px;
      border: 1px solid var(--demo-line);
      border-radius: var(--demo-radius-md);
      padding: 13px;
      background: #fff;
      transition: 170ms ease;
    }

    .book-card:hover {
      border-color: #f1c3bd;
      box-shadow: 0 13px 28px rgba(75, 47, 39, 0.1);
      transform: translateY(-2px);
    }

    .book-cover-button {
      min-width: 0;
      align-self: start;
      border: 0;
      border-radius: 7px;
      padding: 0;
      background: transparent;
      perspective: 800px;
    }

    .book-cover,
    .css-cover {
      position: relative;
      width: 100%;
      aspect-ratio: 0.72;
      overflow: hidden;
      border-radius: 4px 7px 7px 4px;
      background: #fff;
      box-shadow:
        inset 4px 0 0 rgba(0, 0, 0, 0.08),
        0 8px 17px rgba(51, 35, 29, 0.16);
      transition: 180ms ease;
      transform-origin: left center;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .book-cover-button:hover .book-cover,
    .book-cover-button:hover .css-cover {
      box-shadow:
        inset 4px 0 0 rgba(0, 0, 0, 0.08),
        5px 11px 19px rgba(51, 35, 29, 0.18);
      transform: rotateY(-4deg) translateY(-1px);
    }

    .css-cover {
      color: var(--cover-ink, #fff);
      background: var(--cover-bg, #352d2a);
      text-align: left;
    }

    .css-cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--cover-art, linear-gradient(145deg, transparent, rgba(255, 255, 255, 0.16)));
    }

    .css-cover::after {
      content: "";
      position: absolute;
      right: 10px;
      bottom: 11px;
      width: 32px;
      height: 3px;
      border-radius: 999px;
      background: var(--cover-accent, currentColor);
      box-shadow: 0 -7px 0 color-mix(in srgb, var(--cover-accent, currentColor) 50%, transparent);
    }

    .cover-label,
    .cover-title,
    .cover-author {
      position: absolute;
      z-index: 1;
      right: 10px;
      left: 13px;
    }

    .cover-label {
      top: 12px;
      color: var(--cover-accent, currentColor);
      font-size: 6px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .cover-title {
      top: 29%;
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: clamp(13px, 1vw, 18px);
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 0.03em;
    }

    .cover-author {
      bottom: 25px;
      font-size: 6px;
      font-weight: 700;
      opacity: 0.76;
    }

    .book-card-copy {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-top: 2px;
    }

    .book-tag {
      display: inline-flex;
      margin-bottom: 6px;
      border-radius: 999px;
      padding: 3px 7px;
      color: var(--demo-accent);
      background: var(--demo-accent-soft);
      font-size: 9px;
      font-weight: 800;
    }

    .book-title-button {
      max-width: 100%;
      border: 0;
      padding: 0;
      overflow: hidden;
      color: #302a27;
      background: transparent;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.4;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .book-title-button:hover {
      color: var(--demo-accent);
    }

    .book-author {
      max-width: 100%;
      margin: 4px 0 6px;
      overflow: hidden;
      color: #8a837d;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .book-rating {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--demo-warning);
      font-size: 9px;
      white-space: nowrap;
    }

    .book-rating strong {
      color: #7e7770;
      font-size: 9px;
    }

    .book-price {
      margin: auto 0 8px;
      padding-top: 9px;
      color: var(--demo-danger);
      font-size: 15px;
      font-weight: 900;
    }

    .card-action {
      width: 100%;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid #f3c0ba;
      border-radius: 8px;
      padding: 5px 8px;
      color: var(--demo-accent);
      background: #fffaf9;
      font-size: 10px;
      font-weight: 800;
    }

    .card-action:hover {
      border-color: transparent;
      color: #fff;
      background: var(--demo-gradient);
    }

    .empty-state {
      min-height: 250px;
      display: grid;
      place-items: center;
      color: var(--demo-muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 5px;
      color: var(--demo-title);
    }

    .home-aside {
      position: sticky;
      top: 94px;
      display: grid;
      gap: 15px;
    }

    .side-card {
      border: 1px solid var(--demo-line);
      border-radius: var(--demo-radius-md);
      padding: 16px;
      background: var(--demo-surface);
      box-shadow: var(--demo-shadow-soft);
    }

    .side-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .side-heading h2 {
      margin: 0;
      color: var(--demo-title);
      font-size: 15px;
    }

    .side-heading h2 span {
      margin-left: 4px;
      color: var(--demo-muted);
      font-size: 11px;
      font-weight: 500;
    }

    .text-button {
      border: 0;
      padding: 4px;
      color: var(--demo-accent);
      background: transparent;
      font-size: 10px;
      font-weight: 800;
    }

      font-size: 10px;
      font-weight: 900;
    }

    .chapter-copy {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .chapter-copy strong {
      font-size: 11px;
    }

    .chapter-copy span {
      overflow: hidden;
      color: var(--demo-muted);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chapter-count {
      color: #8b837d;
      font-size: 9px;
    }

    .audience-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .audience-card {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 11px;
      border: 1px solid #eee8e3;
      border-radius: 11px;
      padding: 14px;
    }

    .audience-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: var(--demo-accent);
      background: var(--demo-accent-soft);
      font-size: 15px;
    }

    .audience-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
    }

    .audience-card p {
      margin: 0;
      color: var(--demo-muted);
      font-size: 9px;
      line-height: 1.55;
    }

    .detail-side {
      display: grid;
      gap: 14px;
    }

    .detail-side-card {
      border: 1px solid var(--demo-line);
      border-radius: var(--demo-radius-md);
      padding: 17px;
      background: var(--demo-surface);
      box-shadow: var(--demo-shadow-soft);
    }

    .detail-side-card h2 {
      margin: 0 0 12px;
      font-size: 14px;
    }

    .reading-path {
      display: grid;
      gap: 11px;
    }

    .reading-step {
      position: relative;
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr);
      gap: 9px;
    }

    .reading-step:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 27px;
      bottom: -11px;
      left: 13px;
      width: 1px;
      background: #efd8d4;
    }

    .reading-step span {
      position: relative;
      z-index: 1;
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--demo-gradient);
      font-size: 9px;
      font-weight: 900;
    }

    .reading-step strong {
      display: block;
      font-size: 10px;
    }

    .reading-step p {
      margin: 3px 0 0;
      color: var(--demo-muted);
      font-size: 8px;
      line-height: 1.5;
    }

    .related-list {
      display: grid;
      gap: 9px;
    }

    .related-item {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      border: 0;
      padding: 6px;
      border-radius: 9px;
      background: transparent;
      text-align: left;
    }

    .related-item:hover {
      background: var(--demo-accent-soft);
    }

    .related-item .mini-cover {
      width: 38px;
    }

    .related-item strong {
      display: block;
      overflow: hidden;
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .related-item span {
      display: block;
      margin-top: 3px;
      color: var(--demo-muted);
      font-size: 8px;
    }

    .mobile-nav {
      display: none;
    }

    .drawer-backdrop {
      position: fixed;
      z-index: 80;
      inset: 0;
      border: 0;
      background: rgba(28, 20, 17, 0.42);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .drawer-backdrop.is-open {
      opacity: 1;
    }

    .cart-drawer {
      position: fixed;
      z-index: 90;
      right: 0;
      bottom: 0;
      width: min(430px, 100%);
      max-height: min(78vh, 760px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border: 1px solid var(--demo-line);
      border-radius: 20px 20px 0 0;
      background: #fff;
      box-shadow: 0 -26px 60px rgba(34, 22, 18, 0.22);
      transform: translateY(105%);
      transition: transform 220ms ease;
    }

    .cart-drawer.is-open {
      transform: translateY(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--demo-line);
      padding: 16px 18px;
    }

    .drawer-header h2 {
      margin: 0;
      font-size: 16px;
    }

    .icon-button {
      width: 35px;
      height: 35px;
      display: grid;
      place-items: center;
      border: 1px solid var(--demo-line);
      border-radius: 50%;
      color: #655d57;
      background: #fff;
    }

    .icon-button:hover {
      border-color: #efb9b3;
      color: var(--demo-accent);
      background: var(--demo-accent-soft);
    }

    .drawer-items {
      overflow-y: auto;
      padding: 6px 18px;
    }

    .drawer-item {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 13px 0;
      border-bottom: 1px solid #f0ece8;
    }

    .drawer-item .mini-cover {
      width: 52px;
    }

    .drawer-item-copy {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .drawer-item-copy strong {
      overflow: hidden;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .drawer-item-copy span {
      color: var(--demo-danger);
      font-size: 10px;
      font-weight: 800;
    }

    .drawer-footer {
      border-top: 1px solid var(--demo-line);
      padding: 13px 18px 18px;
      background: #fff;
    }

    .drawer-footer .cart-total {
      justify-content: space-between;
      padding-top: 0;
    }

    .toast {
      position: fixed;
      z-index: 120;
      right: 24px;
      bottom: 28px;
      max-width: min(360px, calc(100% - 32px));
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid #f3d2ce;
      border-radius: 12px;
      padding: 12px 14px;
      color: #443b37;
      background: #fff;
      box-shadow: 0 17px 40px rgba(52, 32, 25, 0.17);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: 180ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast .icon {
      flex: 0 0 auto;
      color: var(--demo-success);
    }

    @media (max-width: 1280px) {
      .header-inner {
        grid-template-columns: auto minmax(290px, 1fr) minmax(250px, 340px) auto;
        gap: 14px;
      }

      .brand-copy span {
        display: none;
      }

      .books-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .book-card {
        grid-template-columns: 112px minmax(0, 1fr);
      }

      .detail-product {

    @media (max-width: 1040px) {

      }

      .header-inner {
        grid-template-columns: auto minmax(260px, 1fr) auto;
      }

      .home-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .cart-page-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .cart-summary-card {
        position: static;
      }

      .store-hero {
        grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
      }

      .topic-strip {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .detail-product {
        grid-template-columns: 210px minmax(0, 1fr);
      }

      .purchase-panel {
        grid-column: 1 / -1;

        grid-template-columns: minmax(0, 1fr) minmax(230px, 0.6fr);
        gap: 18px;
      }

      .purchase-actions {
        align-content: center;
      }

      .detail-body {
        grid-template-columns: minmax(0, 1fr) 270px;
      }
    }

    @media (max-width: 820px) {
      .home-layout,
      .detail-body,
      .cart-page-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .cart-summary-card {
        position: static;
      }

      .path-stage {
        grid-template-columns: 70px minmax(0, 1fr);
      }

      .path-books {
        grid-column: 1 / -1;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        justify-content: stretch;
      }

      .home-aside,
      .detail-side {
        display: none;
      }

      .store-hero {
        grid-template-columns: minmax(0, 1.15fr) minmax(250px, 0.85fr);
      }

      .cart-drawer {
        right: max(0px, calc((100vw - 540px) / 2));
        width: min(540px, 100%);
      }
    }

    @media (max-width: 640px) {
      body {
        padding-bottom: 68px;
      }

      .site-header {
        position: relative;
      }

      .header-inner {
        width: 100%;

        grid-template-columns: minmax(0, 1fr) auto;
        padding: 8px 13px;
      }

      .brand-mark {
        width: 35px;

      }

      .brand-copy strong {
        font-size: 15px;
      }

      .header-inner > .search-form {

      }

      .header-action {

      .header-action > span:not(.cart-count) {

      .language-switch {

      }

      .account-action {

      .mobile-search {

      }

      .mobile-search .search-input {
        height: 39px;
      }

      .app-page {

      }

      .home-main {

      }

      .store-hero {

      }

      .hero-copy {

      .hero-actions .primary-button,
      .hero-actions .secondary-button {

      }

      .hero-visual {

      .hero-book {

      .signal-chip {

      .topic-strip {

        overflow-x: auto;
        padding: 0 11px 4px;

        scroll-snap-type: x proximity;
      }

      .topic-strip::-webkit-scrollbar {

      }

      .topic-button {
        min-width: 122px;
        min-height: 66px;
        flex: 0 0 auto;
        padding: 9px 10px;
        scroll-snap-align: start;
      }

      .topic-icon {
        width: 34px;
        height: 34px;
      }

      .shelf {
        border-width: 1px 0 0;
        border-radius: 0;
        padding: 15px 10px 23px;
        box-shadow: none;
      }

      .section-heading {
        align-items: flex-start;
      }

      .section-title {
        flex-wrap: wrap;
      }

      .section-title h2 {
        font-size: 16px;
      }

      .result-count {
        flex-basis: 100%;

      .sort-control {

      }

      .books-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .page-intro {
        border-width: 1px 0;

      }

      .page-card {

      }

      .path-stage {

      }

      .path-stage-mark {

      .path-books {

        grid-template-columns: minmax(0, 1fr);

      }

      .cart-commerce-panel,
      .cart-summary-card {

      .cart-table-head {

      .cart-page-item {

        align-items: start;

      }

      .cart-page-item > .cart-checkbox {

        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        padding: 16px;

        border-width: 1px 0;
        border-radius: 0;
        padding: 0 15px 23px;
        box-shadow: none;

      }

      .tab-button {

      }

        grid-template-columns: minmax(0, 1fr);

      .mobile-nav {

        z-index: 60;

        bottom: 0;
        left: 0;

        display: grid;

        padding: 5px max(8px, env(safe-area-inset-right)) max(5px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));

        height: 19px;
      }

    @media (max-width: 380px) {

      }

        font-size: 27px;
      }

        gap: 14px;
        padding-inline: 13px;
      }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="brand" type="button" data-route-home aria-label="返回可观测性书店首页" data-i18n-aria="brandHomeLabel">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" focusable="false">
            <defs>
              <linearGradient id="bookMarkGradientWeb" x1="4" y1="36" x2="36" y2="4" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ff7a00" />
                <stop offset=".56" stop-color="#ff3856" />
                <stop offset="1" stop-color="#d730ff" />
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#bookMarkGradientWeb)" />
            <path fill="#fff" d="M8.5 11.5c4.2 0 7.5 1.1 10.5 3.5v13.5c-3-2.3-6.3-3.5-10.5-3.5V11.5Zm23 0c-4.2 0-7.5 1.1-10.5 3.5v13.5c3-2.3 6.3-3.5 10.5-3.5V11.5Z" />

        <span class="brand-copy"><strong data-i18n="brandTitle">可观测性书店</strong><span data-i18n="brandSubtitle">技术阅读空间</span></span>
      </button>

      <nav class="desktop-nav" aria-label="主导航" data-i18n-aria="mainNavLabel">
        <button class="nav-button is-active" type="button" data-nav="home" data-i18n="navHome">首页</button>
        <button class="nav-button" type="button" data-nav="path" data-i18n="navPath">阅读路径</button>
      </nav>

      <form class="search-form" id="desktopSearchForm" role="search">

        <input class="search-input" id="desktopSearch" type="search" autocomplete="off" placeholder="搜索书名 / 作者 / 技术主题" data-i18n-placeholder="searchPlaceholder" />

      </form>

      <div class="header-actions">
        <button class="language-switch" id="languageSwitch" type="button" aria-label="Switch language">EN</button>
        <button class="header-action" type="button" data-nav="cart">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L20.5 8H6.2"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
          <span data-i18n="navCart">购物车</span>
          <strong class="cart-count" data-cart-count>0</strong>

        <button class="header-action account-action" type="button" data-account>

          <span data-i18n="account">商城账户</span>
        </button>
      </div>
    </div>

    function bookById(id) {
      return books.find((book) => book.id === id);
    }

    function t(key, values = {}) {
      const template = messages[state.language][key] || messages.zh[key] || key;
      return Object.entries(values).reduce((text, [name, value]) => text.replaceAll(`{${name}}`, value), template);
    }

    function localizedBook(book) {
      if (!book || state.language === 'zh') return book;
      return {...book, ...bookEnglish[book.id]};
    }

    function topicCopy(key) {
      const topic = topics.find((item) => item.key === key) || topics[0];
      return topic[state.language];
    }

    function bookImage(book) {
      return state.language === 'en' && book.imageEn ? book.imageEn : book.image;
    }

    function money(value) {
      return `${state.language === 'zh' ? '￥' : '¥'}${Number(value).toFixed(2)}`;
    }

    function coverStyle(book) {
      if (!book.cover) return '';
      return [
        `--cover-bg:${book.cover[0]}`,
        `--cover-ink:${book.cover[1]}`,
        `--cover-accent:${book.cover[2]}`,
        `--cover-art:${book.cover[3]}`
      ].join(';');
    }

    function coverMarkup(book, className = '') {
      const content = localizedBook(book);
      const image = bookImage(content);
      if (image) {
        return `<div class="book-cover ${className}"><img src="${image}" alt="${content.title}" /></div>`;
      }
      return `
        <div class="css-cover ${className}" style="${coverStyle(content)}" role="img" aria-label="${content.title}">
          <span class="cover-label">${state.language === 'zh' ? '可观测性 · 工程实践' : 'OBSERVABILITY · ENGINEERING'}</span>
          <strong class="cover-title">${content.shortTitle.replaceAll('\n', '<br>')}</strong>
          <span class="cover-author">${content.authorShort}</span>
        </div>
      `;
    }

    function miniCoverMarkup(book) {
      const content = localizedBook(book);
      const image = bookImage(content);
      if (image) {
        return `<span class="mini-cover"><img src="${image}" alt="" /></span>`;
      }
      return `<span class="mini-cover css" style="${coverStyle(content)}" data-short="${content.shortTitle.replaceAll('\n', ' ')}" aria-hidden="true"></span>`;
    }

    function bookCardMarkup(book) {
      const content = localizedBook(book);
      return `
        <article class="book-card">
          <button class="book-cover-button" type="button" data-book-id="${book.id}" aria-label="${t('viewDetails')}: ${content.title}">
            ${coverMarkup(book)}
          </button>
          <div class="book-card-copy">
            <span class="book-tag">${content.badge}</span>
            <button class="book-title-button" type="button" data-book-id="${book.id}">${content.title}</button>
            <span class="book-author">${content.authorShort}</span>
            <span class="book-rating" aria-label="${t('ratingLabel', {rating: book.rating.toFixed(1)})}">★★★★★ <strong>${book.rating.toFixed(1)}</strong></span>
            <strong class="book-price">${money(book.price)}</strong>
            <button class="card-action" type="button" data-book-id="${book.id}">${t('viewDetails')}</button>
          </div>
        </article>
      `;
    }

    function filteredBooks() {
      const query = state.query.trim().toLocaleLowerCase(state.language === 'zh' ? 'zh-CN' : 'en-US');
      return books
        .filter((book) => {
          const topicMatches = state.topic === '全部' || book.tags.includes(state.topic);
          const content = localizedBook(book);
          const translatedTopics = book.tags.map((key) => topicCopy(key)[0]).join(' ');
          const haystack = `${book.title} ${book.englishTitle} ${book.author} ${book.description} ${content.title} ${content.englishTitle} ${content.author} ${content.description} ${book.tags.join(' ')} ${translatedTopics}`.toLocaleLowerCase(state.language === 'zh' ? 'zh-CN' : 'en-US');
          return topicMatches && (!query || haystack.includes(query));
        })
        .sort((left, right) => {
          if (state.sort === 'rating') return right.rating - left.rating || left.rank - right.rank;
          if (state.sort === 'price-asc') return left.price - right.price;
          return left.rank - right.rank;
        });
    }

    function renderBooks() {
      const visibleBooks = filteredBooks();
      elements.booksGrid.innerHTML = visibleBooks.map(bookCardMarkup).join('');
      elements.booksGrid.hidden = visibleBooks.length === 0;
      elements.emptyState.hidden = visibleBooks.length > 0;
      elements.resultCount.textContent = t('resultCount', {count: visibleBooks.length});
    }

    function cartEntries() {
      return Array.from(state.cart.entries())
        .map(([id, quantity]) => ({book: bookById(id), quantity}))
        .filter((entry) => entry.book && entry.quantity > 0);
    }

    function selectedCartEntries() {
      return cartEntries().filter(({book}) => state.selectedCart.has(book.id));
    }

    function cartTotals(entries) {
      const summary = entries.reduce((result, entry) => {
        result.count += entry.quantity;
        result.subtotal += entry.book.price * entry.quantity;
        return result;
      }, {count: 0, subtotal: 0});
      summary.shipping = summary.count === 0 || summary.subtotal >= 99 ? 0 : 12;
      summary.total = summary.subtotal + summary.shipping;
      return summary;
    }

    function renderCart() {
      const entries = cartEntries();
      const selectedEntries = selectedCartEntries();
      const allSummary = cartTotals(entries);
      const summary = cartTotals(selectedEntries);
      const allSelected = entries.length > 0 && selectedEntries.length === entries.length;
      elements.cartPageItems.innerHTML = entries.length
        ? entries.map(({book, quantity}) => `
            <article class="cart-page-item${state.selectedCart.has(book.id) ? ' is-selected' : ''}">
              <input class="cart-checkbox" type="checkbox" data-cart-select="${book.id}" ${state.selectedCart.has(book.id) ? 'checked' : ''} aria-label="${t('selectItem', {title: localizedBook(book).title})}" />
              <div class="cart-product">
                ${miniCoverMarkup(book)}
                <span class="cart-page-copy">
                  <button class="cart-title-button" type="button" data-book-id="${book.id}">${localizedBook(book).title}</button>
                  <span class="cart-book-meta">${localizedBook(book).authorShort} · ${t('format')} · ${localizedBook(book).badge}</span>
                  <span class="cart-stock">${t('inStockShort')}</span>
                </span>
              </div>
              <strong class="cart-unit-price">${money(book.price)}</strong>
              <span class="quantity-control" aria-label="${t('itemQuantity', {title: localizedBook(book).title})}">
                <button type="button" data-cart-qty="${book.id}" data-delta="-1" aria-label="${t('removeOne')}">−</button>
                <strong>${quantity}</strong>
                <button type="button" data-cart-qty="${book.id}" data-delta="1" aria-label="${t('addOne')}">+</button>
              </span>
              <strong class="cart-page-price">${money(book.price * quantity)}</strong>
              <button class="cart-remove-button" type="button" data-cart-remove="${book.id}">${t('removeItem')}</button>
            </article>
          `).join('')
        : '';

      elements.cartPageItems.hidden = entries.length === 0;
      elements.cartPageEmpty.hidden = entries.length > 0;
      elements.cartPageEmpty.innerHTML = `<div><strong>${t('cartEmptyTitle')}</strong><span>${t('cartEmptyDescription')}</span></div>`;
      elements.cartTableHead.hidden = entries.length === 0;
      elements.cartListFooter.hidden = entries.length === 0;
      elements.cartSummaryCount.textContent = t('selectedBooks', {count: summary.count});
      elements.cartSubtotal.textContent = money(summary.subtotal);
      elements.cartShipping.textContent = summary.count === 0 ? '—' : (summary.shipping === 0 ? t('free') : money(summary.shipping));
      elements.cartSummaryTotal.textContent = money(summary.total);
      elements.cartCheckoutButton.disabled = summary.count === 0;
      elements.cartCheckoutButton.textContent = t('checkout', {count: summary.count});
      elements.cartRemoveSelectedButton.disabled = selectedEntries.length === 0;

      document.querySelectorAll('[data-cart-select-all]').forEach((checkbox) => {
        checkbox.checked = allSelected;
        checkbox.indeterminate = selectedEntries.length > 0 && !allSelected;
        checkbox.setAttribute('aria-label', t('selectAllAria'));
      });

      document.querySelectorAll('[data-cart-count]').forEach((node) => {
        node.textContent = String(allSummary.count);
        node.hidden = allSummary.count === 0;
      });
    }

    function addToCart(id, quantity = 1) {
      const book = bookById(id);
      if (!book) return;
      state.cart.set(id, (state.cart.get(id) || 0) + quantity);
      state.selectedCart.add(id);
      renderCart();
      showToast(t('added', {title: localizedBook(book).title}));
    }

    function updateCartQuantity(id, delta) {
      const book = bookById(id);
      if (!book) return;
      const next = (state.cart.get(id) || 0) + delta;
      if (next <= 0) {
        state.cart.delete(id);
        state.selectedCart.delete(id);
        showToast(t('removed', {title: localizedBook(book).title}));
      } else {
        state.cart.set(id, next);
      }
      renderCart();
    }

    function removeCartItem(id) {
      const book = bookById(id);
      if (!book || !state.cart.has(id)) return;
      state.cart.delete(id);
      state.selectedCart.delete(id);
      renderCart();
      showToast(t('removed', {title: localizedBook(book).title}));
    }

    function toggleCartItem(id, selected) {
      if (!state.cart.has(id)) return;
      if (selected) state.selectedCart.add(id);
      else state.selectedCart.delete(id);
      renderCart();
    }

    function toggleAllCartItems(selected) {
      state.selectedCart.clear();
      if (selected) cartEntries().forEach(({book}) => state.selectedCart.add(book.id));
      renderCart();
    }

    function removeSelectedCartItems() {
      const selectedIds = selectedCartEntries().map(({book}) => book.id);
      if (!selectedIds.length) return;
      selectedIds.forEach((id) => {
        state.cart.delete(id);
        state.selectedCart.delete(id);
      });
      renderCart();
      showToast(t('removedSelected', {count: selectedIds.length}));
    }

    function setTopic(topic) {
      state.topic = topic;
      elements.topicStrip.querySelectorAll('[data-topic]').forEach((button) => {
        const active = button.dataset.topic === topic;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      elements.shelfTitle.textContent = topic === '全部' ? t('allShelf') : t('topicShelf', {topic: topicCopy(topic)[0]});
      renderBooks();
    }

    function setSearch(query) {
      state.query = query;
      elements.desktopSearch.value = query;
      elements.mobileSearch.value = query;
      document.querySelectorAll('[data-clear-search]').forEach((button) => {
        button.hidden = !query;
      });
      elements.shelfTitle.textContent = query ? t('searchResults', {query}) : (state.topic === '全部' ? t('allShelf') : t('topicShelf', {topic: topicCopy(state.topic)[0]}));
      renderBooks();
    }

    function applyLanguage(language, persist = false) {
      state.language = language;
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
      document.title = t('documentTitle');
      document.querySelectorAll('[data-i18n]').forEach((node) => {
        node.textContent = t(node.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach((node) => {
        node.placeholder = t(node.dataset.i18nPlaceholder);
      });
      document.querySelectorAll('[data-i18n-aria]').forEach((node) => {
        node.setAttribute('aria-label', t(node.dataset.i18nAria));
      });
      document.querySelectorAll('[data-clear-search]').forEach((button) => button.setAttribute('aria-label', t('clearSearch')));
      elements.languageSwitch.textContent = language === 'zh' ? 'EN' : '中文';
      elements.languageSwitch.setAttribute('aria-label', t('languageLabel'));
      elements.sortControl.innerHTML = `
        <option value="recommended">${t('sortRecommended')}</option>
        <option value="rating">${t('sortRating')}</option>
        <option value="price-asc">${t('sortPrice')}</option>
      `;
      elements.sortControl.value = state.sort;
      elements.emptyState.innerHTML = `<div><strong>${t('emptyTitle')}</strong><span>${t('emptyDescription')}</span></div>`;
      renderHero();
      renderTopicStrip();
      setTopic(state.topic);
      renderPathPage();
      renderCartLabels();
      renderCart();
      renderRoute();
      if (persist) {
        const url = new URL(window.location.href);
        url.searchParams.set('lang', language);
        window.history.replaceState(null, '', url);
      }
    }

    function navigateHome() {
      navigatePage('home');
    }

    function navigatePage(page) {
      if (window.location.hash !== `#${page}`) window.location.hash = page;
      else renderRoute();
    }

    function navigateBook(id) {
      if (!bookById(id)) return;
      window.location.hash = `book/${id}`;
    }

    function currentHashRoute() {
      const hash = window.location.hash.replace(/^#/, '');
      if (hash.startsWith('book/')) {
        const id = hash.slice(5);
        return bookById(id) ? {page: 'book', id} : {page: 'home'};
      }
      return {page: ['home', 'path', 'cart'].includes(hash) ? hash : 'home'};
    }

    function renderRoute() {
      const route = currentHashRoute();
      document.querySelectorAll('[data-page]').forEach((page) => { page.hidden = true; });
      if (route.page === 'book' && bookById(route.id)) {
        if (state.currentBookId !== route.id) {
          state.detailTab = 'overview';
          state.detailQuantity = 1;
        }
        state.currentBookId = route.id;
        elements.detailPage.hidden = false;
        renderBookDetail();
      } else {
        const page = document.querySelector(`[data-page="${route.page}"]`) || elements.homePage;
        page.hidden = false;
        if (route.page === 'home') renderBooks();
        if (route.page === 'path') renderPathPage();
        if (route.page === 'cart') renderCart();
      }
      updateNavigation(route.page);
      window.scrollTo({top: 0, behavior: 'auto'});
    }

    function renderBookDetail() {
      const source = bookById(state.currentBookId);
      if (!source) return;
      const book = localizedBook(source);
      elements.detailCover.innerHTML = coverMarkup(source);
      elements.detailTag.textContent = book.badge;
      elements.detailTitle.textContent = book.title;
      elements.detailEnglishTitle.textContent = book.englishTitle;
      elements.detailRating.textContent = t('score', {rating: book.rating.toFixed(1)});
      elements.detailDescription.textContent = book.description;
      elements.detailAuthor.textContent = t('authorLabel', {author: book.author});
      elements.detailPrice.textContent = money(book.price);
      elements.detailQuantity.textContent = String(state.detailQuantity);
      elements.breadcrumbTitle.textContent = book.title;
      elements.detailMeta.innerHTML = [
        [t('published'), book.published],
        [t('pages'), book.pages],
        [t('level'), book.level],
        [t('publisher'), book.publisher],
        [t('isbn'), book.isbn],
        [t('sku'), `obs-${book.id}`]
      ].map(([label, value]) => `
        <span class="detail-meta-item"><span>${label}</span><strong>${value}</strong></span>
      `).join('');
      elements.detailReadingPath.innerHTML = [1, 2, 3].map((index) => `
        <div class="reading-step"><span>${index}</span><div><strong>${t(`path${['One', 'Two', 'Three'][index - 1]}Title`)}</strong><p>${t(`path${['One', 'Two', 'Three'][index - 1]}Desc`)}</p></div></div>
      `).join('');
      renderDetailTab();
      renderRelatedBooks();
    }

    function renderDetailTab() {
      const source = bookById(state.currentBookId);
      if (!source) return;
      const book = localizedBook(source);
      document.querySelectorAll('[data-detail-tab]').forEach((button) => {
        const active = button.dataset.detailTab === state.detailTab;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-selected', String(active));
      });

      if (state.detailTab === 'chapters') {
        elements.detailTabPanel.innerHTML = `
          <div class="chapter-list">
            ${book.parts.map(([index, title, description, count]) => `
              <article class="chapter-group">
                <span class="chapter-index">${index}</span>
                <span class="chapter-copy"><strong>${title}</strong><span>${description}</span></span>
                <span class="chapter-count">${count}</span>
              </article>
            `).join('')}
          </div>
        `;
        return;
      }

      if (state.detailTab === 'audience') {
        elements.detailTabPanel.innerHTML = `
          <div class="audience-grid">
            ${book.audience.map(([title, description], index) => `
              <article class="audience-card">
                <span class="audience-icon" aria-hidden="true">${['⌘', '◎', '◇', '↗'][index]}</span>
                <div><strong>${title}</strong><p>${description}</p></div>
              </article>
            `).join('')}
          </div>
        `;
        return;
      }

      elements.detailTabPanel.innerHTML = `
        <h2>${t('learnHeading')}</h2>
        <p class="tab-lead">${book.description}</p>
        <div class="learn-grid">
          ${book.learn.map(([title, description], index) => `
            <article class="learn-card">
              <span>0${index + 1}</span>
              <strong>${title}</strong>
              <p>${description}</p>
            </article>
          `).join('')}
        </div>
      `;
    }

    function renderRelatedBooks() {
      const related = books.filter((book) => book.id !== state.currentBookId).slice(0, 3);
      elements.relatedList.innerHTML = related.map((book) => `
        <button class="related-item" type="button" data-book-id="${book.id}">
          ${miniCoverMarkup(book)}
          <span><strong>${localizedBook(book).title}</strong><span>${localizedBook(book).authorShort}</span></span>
        </button>
      `).join('');
    }

    function updateNavigation(active) {
      document.querySelectorAll('[data-nav]').forEach((button) => {
        button.classList.toggle('is-active', button.dataset.nav === active);
      });
      document.querySelectorAll('[data-mobile-nav]').forEach((button) => {
        button.classList.toggle('is-active', button.dataset.mobileNav === active);
      });
    }

    function handleNavigation(action) {
      navigatePage(action);
    }

    function checkout() {
      const summary = cartTotals(selectedCartEntries());
      if (!summary.count) return;
      showToast(t('checkoutToast', {count: summary.count, total: money(summary.total)}));
    }

    function showToast(message) {
      window.clearTimeout(state.toastTimer);
      elements.toastMessage.textContent = message;
      elements.toast.classList.add('is-visible');
      state.toastTimer = window.setTimeout(() => {
        elements.toast.classList.remove('is-visible');
      }, 2400);
    }

    document.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.bookId) navigateBook(button.dataset.bookId);
      if (button.dataset.addCart) addToCart(button.dataset.addCart);
      if (button.dataset.topic) setTopic(button.dataset.topic);
      if (button.dataset.routeHome !== undefined) navigateHome();
      if (button.dataset.nav) handleNavigation(button.dataset.nav);
      if (button.dataset.mobileNav) handleNavigation(button.dataset.mobileNav);
      if (button.dataset.checkout !== undefined) checkout();
      if (button.dataset.cartQty) updateCartQuantity(button.dataset.cartQty, Number(button.dataset.delta));
      if (button.dataset.cartRemove) removeCartItem(button.dataset.cartRemove);
      if (button.dataset.cartRemoveSelected !== undefined) removeSelectedCartItems();
      if (button.dataset.detailTab) {
        state.detailTab = button.dataset.detailTab;
        renderDetailTab();
      }
      if (button.dataset.clearSearch !== undefined) {
        setSearch('');
        elements.desktopSearch.focus();
      }
      if (button.dataset.account !== undefined) showToast(t('accountToast'));
    });

    document.addEventListener('change', (event) => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement)) return;
      if (target.dataset.cartSelect) toggleCartItem(target.dataset.cartSelect, target.checked);
      if (target.dataset.cartSelectAll !== undefined) toggleAllCartItems(target.checked);
    });

    document.querySelectorAll('.search-form').forEach((form) => {
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        navigateHome();
      });
    });

    [elements.desktopSearch, elements.mobileSearch].forEach((input) => {
      input.addEventListener('input', () => {
        setSearch(input.value);
        if (elements.homePage.hidden) navigateHome();
      });
    });

    elements.sortControl.addEventListener('change', () => {
      state.sort = elements.sortControl.value;
      renderBooks();
    });

    elements.detailMinus.addEventListener('click', () => {
      state.detailQuantity = Math.max(1, state.detailQuantity - 1);
      elements.detailQuantity.textContent = String(state.detailQuantity);
    });

    elements.detailPlus.addEventListener('click', () => {
      state.detailQuantity = Math.min(9, state.detailQuantity + 1);
      elements.detailQuantity.textContent = String(state.detailQuantity);
    });

    elements.detailAddButton.addEventListener('click', () => {
      addToCart(state.currentBookId, state.detailQuantity);
    });

    elements.detailBuyButton.addEventListener('click', () => {
      addToCart(state.currentBookId, state.detailQuantity);
      navigatePage('cart');
    });

    elements.languageSwitch.addEventListener('click', () => {
      applyLanguage(state.language === 'zh' ? 'en' : 'zh', true);
    });

    window.addEventListener('hashchange', renderRoute);

    applyLanguage(state.language);
  </script>
</body>
</html>
