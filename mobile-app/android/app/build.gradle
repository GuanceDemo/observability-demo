apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "ft-plugin"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["safeDebug", "safeDebugOptimized", "demoFaultsDebug", "demoFaultsDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true
// Keep profiling and Replay isolation opt-in; normal releases retain collection.
def diagnosticProfileable = providers.gradleProperty("MALL_DEMO_PROFILEABLE")
        .map { it.toBoolean() }.getOrElse(false)
def diagnosticDisableReplay = providers.gradleProperty("MALL_DEMO_DISABLE_REPLAY")
        .map { it.toBoolean() }.getOrElse(false)
if (diagnosticDisableReplay && !diagnosticProfileable) {
    throw new GradleException("MALL_DEMO_DISABLE_REPLAY requires MALL_DEMO_PROFILEABLE=true")
}
def configuredGatewayUrl = project.findProperty("MALL_DEMO_GATEWAY_URL")
        ?: System.getenv("MALL_DEMO_GATEWAY_URL")
        ?: "http://120.79.13.13:31080"
def configuredRumDatawayUrl = project.findProperty("MALL_DEMO_RUM_DATAWAY_URL")
        ?: System.getenv("MALL_DEMO_RUM_DATAWAY_URL")
        ?: "https://rum-openway.guance.com"
def configuredRumClientToken = project.findProperty("MALL_DEMO_RUM_CLIENT_TOKEN")
        ?: System.getenv("MALL_DEMO_RUM_CLIENT_TOKEN")
        ?: ""
def configuredRumAndroidAppId = project.findProperty("MALL_DEMO_RUM_ANDROID_APP_ID")
        ?: System.getenv("MALL_DEMO_RUM_ANDROID_APP_ID")
        ?: "mall_app_android"
def configuredRumService = project.findProperty("MALL_DEMO_RUM_SERVICE")
        ?: System.getenv("MALL_DEMO_RUM_SERVICE")
        ?: "mall-app-android"
def configuredRumEnv = project.findProperty("MALL_DEMO_RUM_ENV")
        ?: System.getenv("MALL_DEMO_RUM_ENV")
        ?: "prod"
def configuredDirectRumEnabled = !configuredRumDatawayUrl.toString().trim().isEmpty()
        && !configuredRumClientToken.toString().trim().isEmpty()
        && !configuredRumAndroidAppId.toString().trim().isEmpty()

def buildConfigString = { value ->
    def escaped = value.toString().replace("\\", "\\\\").replace('"', '\\"')
    return "\"${escaped}\""
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.malldemomobile"
    defaultConfig {
        applicationId "com.malldemomobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "2.3.15"
        manifestPlaceholders["profileableByShell"] = diagnosticProfileable.toString()
        buildConfigField "boolean", "DIAGNOSTIC_DISABLE_REPLAY", diagnosticDisableReplay.toString()
        buildConfigField "String", "GATEWAY_URL", buildConfigString(configuredGatewayUrl)
        buildConfigField "String", "RUM_DATAWAY_URL", buildConfigString(configuredRumDatawayUrl)
        buildConfigField "String", "RUM_CLIENT_TOKEN", buildConfigString(configuredRumClientToken)
        buildConfigField "String", "RUM_ANDROID_APP_ID", buildConfigString(configuredRumAndroidAppId)
        buildConfigField "String", "RUM_SERVICE", buildConfigString(configuredRumService)
        buildConfigField "String", "RUM_ENV", buildConfigString(configuredRumEnv)
        buildConfigField "boolean", "RUM_DIRECT_ENABLED", configuredDirectRumEnabled.toString()
    }
    buildFeatures {
        buildConfig true
    }
    flavorDimensions "faultMode"
    productFlavors {
        safe {
            dimension "faultMode"
            applicationIdSuffix ".safe"
            buildConfigField "boolean", "DEMO_FAULTS_ENABLED", "false"
            resValue "string", "app_name", "Mall Demo Safe"
        }
        demoFaults {
            dimension "faultMode"
            applicationIdSuffix ".demofaults"
            buildConfigField "boolean", "DEMO_FAULTS_ENABLED", "true"
            resValue "string", "app_name", "Mall Demo Faults"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            ndk {
                debugSymbolLevel "FULL"
            }
        }
    }
}

androidComponents {
    finalizeDsl { extension ->
        // React Native defaults Release builds to HTTPS-only. Keep that default,
        // but allow an explicitly configured HTTP Gateway for internal USB demos.
        if (configuredGatewayUrl.startsWith("http://")) {
            extension.buildTypes
                    .getByName("release")
                    .manifestPlaceholders["usesCleartextTraffic"] = "true"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Keep the native Android SDK and Session Replay resource callback ABI on
    // the same release line. The direct declarations intentionally override
    // the React Native bridges' older transitive pins.
    implementation("com.cloudcare.ft.mobile.sdk.tracker.agent:ft-sdk:1.7.5")
    implementation("com.cloudcare.ft.mobile.sdk.tracker.agent:ft-native:1.1.3")
    implementation("com.cloudcare.ft.mobile.sdk.tracker.agent:ft-session-replay:0.1.8")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
