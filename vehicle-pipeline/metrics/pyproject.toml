[project]
name = "vehicle-pipeline-metrics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3==1.42.39", "PyMySQL==1.1.2", "requests==2.32.5", "prometheus-client==0.24.1"]

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vehicle_metrics"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
