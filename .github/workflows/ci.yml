name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode verify

  mobile-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run lint
      - name: Generate React Native SourceMaps
        run: |
          npm run bundle:android
          npm run bundle:ios
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-javascript-sourcemaps
          path: mobile-app/build/sourcemaps
          if-no-files-found: error

  mobile-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build Android Safe and DemoFaults APKs
        working-directory: mobile-app/android
        run: ./gradlew assembleSafeRelease assembleDemoFaultsRelease
      - name: Verify Android Session Replay reflection contract
        run: |
          npm run verify:android-replay -- \
            android/app/build/outputs/apk/safe/release/app-safe-release.apk \
            android/app/build/outputs/apk/demoFaults/release/app-demoFaults-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-apks-and-symbols
          path: |
            mobile-app/android/app/build/outputs/apk
            mobile-app/android/app/build/outputs/mapping
            mobile-app/android/app/build/outputs/native-debug-symbols
          if-no-files-found: warn

  mobile-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile-app
      - run: npm ci
      - name: Install iOS pods
        working-directory: mobile-app/ios
        run: bundle exec pod install
      - name: Build iOS Safe scheme
        working-directory: mobile-app/ios
        run: |
          mkdir -p build/results
          xcodebuild \
            -quiet \
            -workspace MallDemoMobile.xcworkspace \
            -scheme MallDemoMobileSafe \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-Safe \
            -resultBundlePath build/results/Safe.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build iOS DemoFaults scheme
        working-directory: mobile-app/ios
        run: |
          xcodebuild \
            -quiet \
            -workspace MallDemoMobile.xcworkspace \
            -scheme MallDemoMobileDemoFaults \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-DemoFaults \
            -resultBundlePath build/results/DemoFaults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload iOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-xcresults
          path: mobile-app/ios/build/results
          if-no-files-found: warn
          retention-days: 7

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Check shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Render Compose
        run: docker compose --env-file .env.example config >/dev/null
      - name: Lint and render Helm
        run: |
          helm lint charts/observability-demo
          helm lint charts/observability-demo --values charts/observability-demo/values-eks.yaml
          helm lint charts/observability-demo \
            --values charts/observability-demo/values-eks.yaml \
            --set-string rum.enabled=true \
            --set-string rum.applicationId=test-rum \
            --set-string observability.clusterName=test-cluster \
            --set-string observabilityConsole.url=https://console.guance.com/ \
            --set-string observabilityConsole.workspaceId=test-workspace
          helm template demo charts/observability-demo --namespace observability-demo >/tmp/rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary </tmp/rendered.yaml
          helm template demo charts/observability-demo \
            --namespace observability-demo \
            --values charts/observability-demo/values-eks.yaml \
            >/tmp/eks-rendered.yaml
          grep -A20 'component: gateway-service' /tmp/eks-rendered.yaml | grep -q 'type: LoadBalancer'
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary </tmp/eks-rendered.yaml
          helm template demo charts/observability-demo \
            --namespace observability-demo \
            --values charts/observability-demo/values-eks.yaml \
            --set-string rum.enabled=true \
            --set-string rum.applicationId=test-rum \
            --set-string observability.clusterName=test-cluster \
            --set-string observabilityConsole.url=https://console.guance.com/ \
            --set-string observabilityConsole.workspaceId=test-workspace \
            >/tmp/workshop-rendered.yaml
          grep -q 'pubrepo.jiagouyun.com/demo/observability-demo-gateway-service:2.3.1' /tmp/workshop-rendered.yaml
          grep -q 'cluster_name_k8s:test-cluster' /tmp/workshop-rendered.yaml
          grep -A20 'name: DATAKIT_PROVIDER' /tmp/workshop-rendered.yaml | grep -q 'guance'
          grep -A20 'name: OBSERVABILITY_CONSOLE_URL' /tmp/workshop-rendered.yaml | grep -q 'https://console.guance.com/'
          grep -A20 'component: gateway-service' /tmp/workshop-rendered.yaml | grep -q 'type: LoadBalancer'
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary </tmp/workshop-rendered.yaml
          helm repo add datakit https://pubrepo.guance.com/chartrepo/datakit
          helm repo update
          helm template datakit datakit/datakit \
            --version 2.5.0 \
            --namespace datakit \
            --values observability/datakit-values.example.yaml \
            --set-string datakit.dataway_url=https://example.invalid \
            >/tmp/datakit-rendered.yaml
          grep -q 'project=mall-demo' /tmp/datakit-rendered.yaml
          grep -q 'GET /actuator/health' /tmp/datakit-rendered.yaml
          grep -q 'route_class' /tmp/datakit-rendered.yaml
          grep -q 'traffic_type' /tmp/datakit-rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary </tmp/datakit-rendered.yaml
      - name: Verify workshop release contract
        run: |
          grep -q '^version: 2.3.1$' charts/observability-demo/Chart.yaml
          grep -q '^appVersion: "2.3.1"$' charts/observability-demo/Chart.yaml
          grep -q "if: github.repository == 'cherrycove/observability-demo'" .github/workflows/release-images.yml
          if rg 'scripts/workshop\.sh install|install_workshop' README.md docs charts scripts; then
            echo 'removed one-click workshop installer reference found' >&2
            exit 1
          fi
          if rg 'values-workshop-truewatch\.yaml|TRUEWATCH_WORKSPACE_ID|pubrepo\.truewatch\.com/chartrepo/datakit|export AWS_REGION|--region "\$AWS_REGION"' README.md; then
            echo 'obsolete Workshop platform or Region reference found in README' >&2
            exit 1
          fi
          grep -q 'readonly PROVIDER="guance"' scripts/workshop.sh
          grep -q 'observabilityConsole.url="https://console.guance.com/"' README.md
          if rg 'https://github.com/(TrueWatchTech|cherrycove)/observability-demo(\.git)?|demo-control-token|DEMO_CONTROL_TOKEN' \
            README.md docs charts scripts --glob '!release.md'; then
            echo 'obsolete workshop repository or control-token reference found' >&2
            exit 1
          fi
      - name: Verify Gateway observability fields
        run: |
          for properties in */src/main/resources/application.properties; do
            grep -q 'route_class=%X{route_class}' "${properties}"
            grep -q 'traffic_type=%X{traffic_type}' "${properties}"
            grep -q 'client_ip=%X{client_ip}' "${properties}"
            grep -q 'user_agent=%X{user_agent}' "${properties}"
            grep -q 'referer=%X{referer}' "${properties}"
          done
          grep -q 'set_tag(route_class)' observability/platform-log-pipeline.p
          grep -q 'set_tag(traffic_type)' observability/platform-log-pipeline.p
          grep -q 'client_ip=%{DATA:client_ip}' observability/platform-log-pipeline.p
          grep -q 'user_agent=%{DATA:user_agent}' observability/platform-log-pipeline.p
          grep -q 'referer=%{GREEDYDATA:referer}' observability/platform-log-pipeline.p
      - name: Custom secret rules
        run: scripts/secret-scan.sh
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 dir --config /repo/.gitleaks.toml --no-banner --redact /repo

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start clean Compose stack
        run: |
          cp .env.example .env
          docker compose build --pull
          docker compose up -d
      - name: Wait and smoke test
        run: |
          if ! curl --fail --silent \
            --retry 60 --retry-delay 5 --retry-all-errors --retry-max-time 300 \
            http://127.0.0.1:8080/api/demo/config >/dev/null; then
            echo "::error::Gateway and order-service did not become ready within 5 minutes"
            exit 1
          fi
          scripts/smoke-test.sh
          test "$(docker compose exec -T order-service printenv PROJECT_TAG)" = "mall-demo"
          test "$(docker compose exec -T order-service printenv DD_TAGS)" = "project:mall-demo"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans

  kind-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: observability-demo
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Build and load images
        run: |
          for service in gateway order inventory payment; do
            docker build -f "${service}-service/Dockerfile" -t "docker.io/library/observability-demo-${service}-service:ci" .
            kind load docker-image --name observability-demo "docker.io/library/observability-demo-${service}-service:ci"
          done
      - name: Install demo
        run: |
          helm install demo charts/observability-demo \
            --namespace observability-demo \
            --create-namespace \
            --set image.registry=docker.io \
            --set image.owner=library \
            --set image.tag=ci \
            --set image.pullPolicy=Never
          for deployment in $(kubectl -n observability-demo get deployments -o name); do
            kubectl -n observability-demo rollout status "${deployment}" --timeout=8m
          done
          secret_name=demo-observability-demo
          secret_before="$(kubectl -n observability-demo get secret "${secret_name}" -o jsonpath='{.data.mysql-password}:{.data.mysql-root-password}')"
          test -n "${secret_before}"
          helm upgrade demo charts/observability-demo \
            --namespace observability-demo \
            --set image.registry=docker.io \
            --set image.owner=library \
            --set image.tag=ci \
            --set image.pullPolicy=Never
          secret_after="$(kubectl -n observability-demo get secret "${secret_name}" -o jsonpath='{.data.mysql-password}:{.data.mysql-root-password}')"
          test "${secret_before}" = "${secret_after}"
      - name: Verify security and behavior
        run: |
          kubectl -n observability-demo port-forward svc/demo-observability-demo-gateway-service 8080:80 >/tmp/port-forward.log 2>&1 &
          if ! curl --fail --silent \
            --retry 30 --retry-delay 2 --retry-all-errors --retry-max-time 60 \
            http://127.0.0.1:8080/api/demo/config >/dev/null; then
            echo "::error::Gateway port-forward did not become ready within 1 minute"
            exit 1
          fi
          scripts/smoke-test.sh
          test "$(kubectl -n observability-demo get pod -l app.kubernetes.io/component=order-service -o jsonpath='{.items[0].spec.securityContext.runAsUser}')" = "10001"
          test "$(kubectl -n observability-demo get pod -l app.kubernetes.io/component=order-service -o jsonpath='{.items[0].metadata.labels.project}')" = "mall-demo"
          test "$(kubectl -n observability-demo get pod -l app.kubernetes.io/component=mysql -o jsonpath='{.items[0].metadata.labels.project}')" = "mall-demo"
          # shellcheck disable=SC2016 # The Downward API placeholders must stay literal.
          test "$(kubectl -n observability-demo get pod -l app.kubernetes.io/component=order-service -o jsonpath='{.items[0].spec.containers[0].env[?(@.name=="DD_TAGS")].value}')" = 'project:mall-demo,pod_name:$(POD_NAME),pod_namespace:$(POD_NAMESPACE),host:$(NODE_NAME),container_name:$(CONTAINER_NAME)'
          test "$(kubectl -n observability-demo get pod -l app.kubernetes.io/component=gateway-service -o jsonpath='{.items[0].spec.automountServiceAccountToken}')" = "false"
          log_annotation="$(kubectl -n observability-demo get pod -l app.kubernetes.io/component=order-service -o jsonpath='{.items[0].metadata.annotations.datakit/logs}')"
          grep -q '"source":"java_selfheal_demo"' <<<"${log_annotation}"
          grep -q '"service":"order-service"' <<<"${log_annotation}"
          if grep -q '"pipeline"' <<<"${log_annotation}"; then
            echo "::error::DataKit log annotation must leave the raw message for the platform Pipeline"
            exit 1
          fi
          kubectl auth can-i get pods/log --as system:serviceaccount:observability-demo:demo-observability-demo-log-reader -n observability-demo | grep -q yes
          kubectl auth can-i get secrets --as system:serviceaccount:observability-demo:demo-observability-demo-log-reader -n observability-demo | grep -q no
