# Apply once as a namespace administrator; replace __KUBERNETES_USER__ with
# the authenticated kubeconfig username. Never grant cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vehicle-demo-fault-worker
  namespace: vehicle-pipeline
  labels: {app.kubernetes.io/managed-by: vehicle-demo-api-control}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vehicle-demo-api-client
  namespace: vehicle-pipeline
  labels: {app.kubernetes.io/managed-by: vehicle-demo-api-control}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [vehicle-control, vehicle-kafka, vehicle-flink-taskmanager]
    verbs: [get]
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [vehicle-summary]
    verbs: [get]
  - apiGroups: ['']
    resources: [serviceaccounts]
    resourceNames: [vehicle-demo-fault-worker]
    verbs: [get]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [vehicle-demo-fault-state]
    verbs: [get, update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vehicle-demo-fault-worker
  namespace: vehicle-pipeline
  labels: {app.kubernetes.io/managed-by: vehicle-demo-api-control}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [vehicle-kafka, vehicle-flink-taskmanager]
    verbs: [get, patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [vehicle-summary]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [vehicle-demo-fault-state]
    verbs: [get, update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vehicle-demo-api-client
  namespace: vehicle-pipeline
  labels: {app.kubernetes.io/managed-by: vehicle-demo-api-control}
subjects:
  - {kind: User, name: __KUBERNETES_USER__, apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: Role, name: vehicle-demo-api-client, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vehicle-demo-fault-worker
  namespace: vehicle-pipeline
  labels: {app.kubernetes.io/managed-by: vehicle-demo-api-control}
subjects:
  - {kind: ServiceAccount, name: vehicle-demo-fault-worker, namespace: vehicle-pipeline}
roleRef: {kind: Role, name: vehicle-demo-fault-worker, apiGroup: rbac.authorization.k8s.io}
