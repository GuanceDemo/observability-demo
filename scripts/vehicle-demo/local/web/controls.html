<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车机故障控制</title><link rel="stylesheet" href="/vehicle-demo/controls.css"><script type="module" src="/vehicle-demo/workbench.js"></script></head>
<body data-panel="controls"><main class="controls">
  <section class="control-section"><h2>数据链路故障</h2><p class="muted">作用于车机 Demo 数据链路</p><label class="field-label" for="scenario">选择场景</label><select id="scenario" disabled><option>读取故障目录…</option></select><div class="fault-detail"><p id="description" class="description"></p><p id="expected" class="muted"></p><p id="fault-ttl" class="muted"></p></div><div class="actions"><button id="inject" class="danger" disabled>注入故障</button><button id="recover" class="secondary" disabled>恢复</button></div><p id="operation-status" class="fault-current" role="status">正在读取故障状态…</p><p id="deadline" class="muted"></p><div id="run-links"></div><a id="guance-job-link" class="link-button" href="https://console.guance.com/data-observability/jobs?time=1d" target="_blank" rel="noopener">在观测云查看作业 ↗</a></section>
  <section class="control-section"><div class="heading"><h2>作业运行状态</h2><span class="badge">实际引擎</span></div><p id="jobs-notice" class="muted">正在读取…</p><div id="jobs"></div></section>
  <section class="control-section"><div class="heading"><h2>报表新鲜度</h2><span id="freshness-state" class="badge">待读取</span></div><strong id="freshness" class="freshness">—</strong><p class="muted">当前时间 − 数据截至时间</p><div class="stat"><span>数据截至</span><span id="source-event-time">—</span></div><div class="stat"><span>汇总完成</span><span id="last-success">—</span></div><div class="stat"><span>待上报元数据</span><span id="lineage-pending">—</span></div><a class="link-button" href="https://console.guance.com/data-observability/lineage?time=1d" target="_blank" rel="noopener">查看完整血缘 ↗</a></section>
</main></body></html>
