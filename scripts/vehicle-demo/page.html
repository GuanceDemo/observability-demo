<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>车机遥测 · Vehicle Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1219;color:#edf3f7;font:15px/1.6 system-ui,sans-serif}main{max-width:1328px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;gap:24px;justify-content:space-between;margin-bottom:24px}h1{font-size:28px;margin:4px 0}p{color:#9eb0bf;margin:4px 0}.eyebrow{font-size:12px;color:#64e3bb;letter-spacing:3px}a{color:#64e3bb;text-decoration:none}.download{padding:10px 18px;border:1px solid #35504e;border-radius:12px;white-space:nowrap}.screen{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#101820;border:1px solid #293844}iframe{width:100%;height:100%;border:0;display:block}footer{display:flex;justify-content:space-between;gap:20px;margin-top:18px;color:#9eb0bf;font-size:13px}#connection{color:#ffbf69}@media(max-width:600px){main{padding:20px 12px}h1{font-size:23px}header,footer{align-items:flex-start;flex-direction:column;gap:12px}.screen{border-radius:12px}}
</style>
<main><header><div><div class="eyebrow">VEHICLE LAB</div><h1>车机遥测实验室</h1><p>在真实 Android 车机中切换场景，观察每秒产生的遥测数据。</p></div><a class="download" href="/downloads/vehicle-demo.apk">下载 Android App ↗</a></header>
<div class="screen"><iframe id="vehicle" title="Android 车机遥测" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
<footer><a href="/vehicle-demo/reports.html" target="_blank" rel="noopener">查看数据报表 ↗</a><span id="connection" role="status">正在连接车机画面…</span><span>横屏 1280 × 720 · 关闭本页后继续产数 · Android 7.0+ · v0.1.2</span></footer></main>
<script>
const frame=document.getElementById('vehicle');
const query=new URLSearchParams({url:location.origin+'/__VEHICLE_ROUTE__',embedded:'1',latestVideo:'1',rtcTransport:'relay',hostOrigin:location.origin,v:'vehicle-0.1.1.1'});
frame.src='/vehicle-demo/player/?'+query;
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow)return;const data=event.data;if(data?.source==='vehicle-android-player'&&data?.type==='status'){const ready=data.payload?.ready===true;document.getElementById('connection').textContent=ready?'● 车机画面已连接 · 可直接点击操作':'正在连接车机画面…';document.getElementById('connection').style.color=ready?'#64e3bb':'#ffbf69';}});
</script></html>
